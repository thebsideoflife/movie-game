/* The ball is NOT a position. It is a property of a player — `ball: 'O2'` —
   and gets drawn at a fixed offset from whoever holds it. That makes a loose
   ball structurally impossible rather than something we have to police. */
let BALL_OFF = [22, 12];
const ballXY = (pos, holder) => (pos[holder] ? [pos[holder][0] + BALL_OFF[0], pos[holder][1] + BALL_OFF[1]] : null);
const nearestPlayer = (pos, xy) => {
  let best = OFF[0], bd = Infinity;
  OFF.forEach(t => {
    if (!pos[t]) return;
    const d = Math.hypot(pos[t][0] - xy[0], pos[t][1] - xy[1]);
    if (d < bd) { bd = d; best = t; }
  });
  return best;                          // always returns somebody — never null
};

/* ------------------------------------------------------------
   PLAY MODEL
   A play is { start, steps[] }. Each step holds only the CHANGES
   it makes (moves) plus the lines drawn for it. Positions at any
   point are derived by replaying moves in order — which is what
   makes steps safe to reorder and to merge into one simultaneous
   beat.
   ------------------------------------------------------------ */
const moved = (a, b) => !a || !b || Math.abs(a[0]-b[0]) > 0.5 || Math.abs(a[1]-b[1]) > 0.5;

// drop anything that isn't a current token — this is what clears the old
// X1–X5 defenders out of plays already saved in someone's browser
const keepTokens = (pos) => {
  const o = {};
  ALL_TOKENS.forEach(t => { if (pos && pos[t]) o[t] = [pos[t][0], pos[t][1]]; });
  return o;
};

function migratePlay(p) {
  let start, steps, rest;
  if (p.steps) {                               // step format already
    ({ ...rest } = p);
    start = keepTokens(p.start);
    steps = p.steps.map(s => ({ ...s, moves: keepTokens(s.moves) }));
    // carry across where the ball used to sit as a coordinate
    if (p.start && p.start.BALL) {
      let holder = nearestPlayer(start, p.start.BALL);
      rest.ball = p.ball || holder;
      let running = clone(start);
      steps.forEach((s, i) => {
        Object.assign(running, clone(s.moves));
        const oldBall = p.steps[i].moves && p.steps[i].moves.BALL;
        if (oldBall) {
          const h = nearestPlayer(running, oldBall);
          if (h !== holder) { s.ball = h; holder = h; }
        }
      });
    }
  } else {                                     // oldest format: absolute frames
    const f = p.frames || [];
    const src = f[0]?.pos || BLANK_POS;
    start = keepTokens(src);
    steps = [];
    for (let i = 1; i < f.length; i++) {
      const moves = {};
      ALL_TOKENS.forEach(t => {
        const a = f[i-1].pos[t], b = f[i].pos[t];
        if (a && b && moved(a, b)) moves[t] = [b[0], b[1]];
      });
      const st = { id: uid(), label: f[i].label || `Step ${i}`, moves, draws: clone(f[i-1].draws || []) };
      steps.push(st);
    }
    const { frames, ...r } = p; rest = r;
    let holder = src.BALL ? nearestPlayer(start, src.BALL) : OFF[0];
    rest.ball = holder;
    const running = clone(start);
    steps.forEach((s, i) => {
      Object.assign(running, clone(s.moves));
      const b = f[i+1]?.pos?.BALL;
      if (b) {
        const h = nearestPlayer(running, b);
        if (h !== holder) { s.ball = h; holder = h; }
      }
    });
  }
  if (!rest.ball || !OFF.includes(rest.ball)) rest.ball = OFF[0];
  return { ...rest, start, steps };
}

// who has the ball after k steps
function holderAt(play, k) {
  let h = play.ball || OFF[0];
  for (let i = 0; i < Math.min(k, play.steps.length); i++) if (play.steps[i].ball) h = play.steps[i].ball;
  return h;
}

// positions after k steps
function posAt(play, k) {
  const p = clone(play.start);
  for (let i = 0; i < Math.min(k, play.steps.length); i++) Object.assign(p, clone(play.steps[i].moves));
  return p;
}
// frame k shows positions after k steps, plus the lines for the step that comes next
function framesOf(play) {
  const out = [];
  const cur = clone(play.start);
  let holder = play.ball || OFF[0];
  out.push({ key: 'set', label: 'Set', pos: clone(cur), ball: holder, ballXY: ballXY(cur, holder), draws: play.steps[0]?.draws || [] });
  play.steps.forEach((s, i) => {
    Object.assign(cur, clone(s.moves));
    if (s.ball) holder = s.ball;
    out.push({ key: s.id, label: s.label, pos: clone(cur), ball: holder, ballXY: ballXY(cur, holder),
               draws: play.steps[i+1]?.draws || [] });
  });
  return out;
}
const stepTokens = (s) => [...ALL_TOKENS.filter(t => s.moves[t]), ...(s.ball ? ['BALL'] : [])];

  notes: {},               // { eventId: 'text' }
  plays: clone(SAMPLE_PLAYS)
});
function normalizeDoc(d) {
  const doc = { ...emptyDoc(), ...(d || {}) };
  doc.plays = (doc.plays || []).map(migratePlay);   // upgrade plays saved in any older shape
  if (!doc.plays.length) doc.plays = clone(SAMPLE_PLAYS);
  ['attendance', 'games', 'notes'].forEach(k => { if (!doc[k] || typeof doc[k] !== 'object') doc[k] = {}; });
  ['roster', 'events'].forEach(k => { if (!Array.isArray(doc[k])) doc[k] = []; });
  return doc;
}

/* Everything server-side goes through here. Cookies carry the session, so
   there is no token for the page to hold on to or leak. */
async function api(path, { method = 'GET', body } = {}) {
  const res = await fetch('/api' + path, {
    method,
    credentials: 'same-origin',
    headers: body ? { 'content-type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  let data = {};
  try { data = await res.json(); } catch (e) {}
  if (!res.ok) { const err = new Error(data.error || 'Something went wrong.'); err.status = res.status; err.data = data; throw err; }
  return data;
}

function strokePath(pts) {
  if (!pts.length) return '';
  return 'M' + pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L');
}
function screenBar(pts) {
  if (pts.length < 2) return null;
  const [ax, ay] = pts[pts.length - 2], [bx, by] = pts[pts.length - 1];
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1;
  const nx = -dy / len * 11, ny = dx / len * 11;
  return `M${(bx-nx).toFixed(1)},${(by-ny).toFixed(1)} L${(bx+nx).toFixed(1)},${(by+ny).toFixed(1)}`;
}

function Court({ pos, ballAt, draws = [], editing = false, tool = 'select', selected, onSelect, onMove, onDraw,
                 onBallAssign, ghost = null, drawOpacity = 1, className = '' }) {
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  const [stroke, setStroke] = useState(null);
  const [ballDrag, setBallDrag] = useState(null);   // ball position while being dragged
  /* the ref shadows the state: on a fast flick, pointerup can fire in the same
     tick as the last pointermove, before React has flushed setBallDrag */
  const ballDragRef = useRef(null);

  const toPt = useCallback((e) => {
    const r = svgRef.current.getBoundingClientRect();
    return [VIEW.x + (e.clientX - r.left) / r.width * VIEW.w,
            VIEW.y + (e.clientY - r.top) / r.height * VIEW.h];
  }, []);
  const clamp = ([x, y]) => [Math.max(VIEW.x + 14, Math.min(VIEW.x + VIEW.w - 14, x)),
                             Math.max(VIEW.y + 14, Math.min(VIEW.y + VIEW.h - 14, y))];

  const tokenDown = (id) => (e) => {
    if (!editing || tool !== 'select') return;
    e.stopPropagation();
    e.currentTarget.ownerSVGElement.setPointerCapture(e.pointerId);
    const [px, py] = toPt(e);
    dragRef.current = { id, dx: px - pos[id][0], dy: py - pos[id][1] };
    onSelect && onSelect(id);
  };
  // dragging the ball doesn't move it — it hands possession to someone else
  const ballDown = (e) => {
    if (!editing || tool !== 'select' || !ballAt) return;
    e.stopPropagation();
    e.currentTarget.ownerSVGElement.setPointerCapture(e.pointerId);
    const [px, py] = toPt(e);
    dragRef.current = { id: '__ball__', dx: px - ballAt[0], dy: py - ballAt[1] };
    ballDragRef.current = [...ballAt];
    setBallDrag([...ballAt]);
    onSelect && onSelect('BALL');
  };
  // nearest player to a point, or null if nothing is close enough
  const nearestToken = (pt, { max = 52 } = {}) => {
    let best = null, bd = Infinity;
    ALL_TOKENS.forEach(t => {
      if (!pos[t]) return;
      const d = Math.hypot(pos[t][0] - pt[0], pos[t][1] - pt[1]);
      if (d < bd) { bd = d; best = t; }
    });
    return bd <= max ? best : null;
  };

  const bgDown = (e) => {
    if (!editing) return;
    if (tool === 'select') { onSelect && onSelect(null); return; }
    svgRef.current.setPointerCapture(e.pointerId);
    const p = clamp(toPt(e));
    // a movement line always originates from the player (or the ball for a
    // pass), never from whatever pixel happened to be touched
    let origin = p;
    if (tool === 'pass' && ballAt) origin = [...ballAt];
    else { const t = nearestToken(p); if (t) origin = [...pos[t]]; }
    setStroke([origin]);
  };
  const move = (e) => {
    if (dragRef.current) {
      const [px, py] = toPt(e);
      const d = dragRef.current;
      if (d.id === '__ball__') { const q = clamp([px - d.dx, py - d.dy]); ballDragRef.current = q; setBallDrag(q); }
      else onMove && onMove(d.id, clamp([px - d.dx, py - d.dy]));
    } else if (stroke) {
      const p = clamp(toPt(e));
      const last = stroke[stroke.length - 1];
      if (Math.hypot(p[0] - last[0], p[1] - last[1]) > 7) setStroke([...stroke, p]);
    }
  };
  const up = () => {
    if (dragRef.current && dragRef.current.id === '__ball__') {
      // wherever it was dropped, the nearest player takes possession
      const drop = ballDragRef.current;
      if (drop && onBallAssign) onBallAssign(nearestPlayer(pos, drop));
      ballDragRef.current = null;
      setBallDrag(null);
    }
    dragRef.current = null;
    if (stroke) {
      if (stroke.length > 1) onDraw && onDraw({ tool, pts: stroke.map(p => [...p]) });
      setStroke(null);
    }
  };

  const live = stroke ? [...draws, { tool, pts: stroke }] : draws;

  return (
    <svg ref={svgRef} viewBox={`${VIEW.x} ${VIEW.y} ${VIEW.w} ${VIEW.h}`}
      className={cx('court-svg w-full h-auto block rounded-2xl', className)}
      onPointerDown={bgDown} onPointerMove={move} onPointerUp={up} onPointerCancel={up}>
      <defs>
        {Object.entries(DRAW_STYLE).map(([k, v]) => (
          <marker key={k} id={`ar-${k}`} viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
            <path d="M0,0.5 L10,5 L0,9.5 z" fill={v.color} />
          </marker>
        ))}
      </defs>
      <FieldLines />

      {/* ghost of next frame */}
      {ghost && <g opacity=".22">
        {ALL_TOKENS.map(t => ghost.pos && ghost.pos[t] && (
          <circle key={t} cx={ghost.pos[t][0]} cy={ghost.pos[t][1]} r={TOK_R} fill="none"
            stroke="#E5A823" strokeWidth="2.5" strokeDasharray="4 4" />
        ))}
        {ghost.ballXY && <circle cx={ghost.ballXY[0]} cy={ghost.ballXY[1]} r="11.5" fill="none"
          stroke="#E2732B" strokeWidth="2.5" strokeDasharray="4 4" />}
      </g>}

      {/* drawings */}
      <g opacity={drawOpacity} style={{ pointerEvents:'none' }}>
        {live.map((d, i) => {
          const st = DRAW_STYLE[d.tool] || DRAW_STYLE.move;
          return <g key={i}>
            <path d={strokePath(d.pts)} fill="none" stroke={st.color} strokeWidth="3.2" strokeDasharray={st.dash}
              strokeLinecap="round" strokeLinejoin="round"
              markerEnd={d.tool === 'screen' ? undefined : `url(#ar-${d.tool})`} />
            {d.tool === 'screen' && <path d={screenBar(d.pts)} stroke={st.color} strokeWidth="3.6" strokeLinecap="round" />}
          </g>;
        })}
      </g>

      {/* tokens */}
      <g>
        {OFF.map(t => pos[t] && <Token key={t} id={t} x={pos[t][0]} y={pos[t][1]}
          editable={editing && tool === 'select'} selected={selected === t} onDown={tokenDown(t)} />)}
        {(ballDrag || ballAt) && <Token id="BALL" x={(ballDrag || ballAt)[0]} y={(ballDrag || ballAt)[1]}
          editable={editing && tool === 'select'} selected={selected === 'BALL'} onDown={ballDown} />}
      </g>
    </svg>
  );
}

    w: 600, h: 450, view: { x:-34, y:-40, w:668, h:530 },
    players: ['A1','A2','A3','M1','M2','M3'],
    ballOff: [20, 12],
    blankPos: { A1:[300,62], A2:[120,215], A3:[480,215], M1:[200,330], M2:[400,330], M3:[300,240] },
    positions: ['A','M','D','LSM','FOGO','G'],
    stats: [['g','G'],['a','A'],['gb','GB'],['ct','CT']],
    derived: { label: 'PTS', calc: (x) => ((+x.g || 0) + (+x.a || 0)) },
    Field: LacrosseLines,
    Ball: LacrosseBall, ballColor: '#FAFAF7', ballStroke: '#26323D',
    moveLabel: 'Cut / Dodge',
    plays: () => clone(LAX_PLAYS)
  }
};

let FieldLines = BasketballLines;
let ACTIVE_SPORT = SPORTS.basketball;

/* Point the whole app at one sport. Called when a team loads, before its
   document is normalised, so plays and rosters are read with the right
   players and positions. */
function applySport(key) {
  const sp = SPORTS[key] || SPORTS.basketball;
  ACTIVE_SPORT = sp;
  CW = sp.w; CH = sp.h; VIEW = sp.view;
  OFF = sp.players; ALL_TOKENS = [...sp.players];
  BALL_OFF = sp.ballOff; BLANK_POS = clone(sp.blankPos);
  POSITIONS = sp.positions; STAT_KEYS = sp.stats; DERIVED = sp.derived;
  FieldLines = sp.Field; BallGlyph = sp.Ball;
  DRAW_STYLE.move.label = sp.moveLabel;
  SAMPLE_PLAYS = sp.plays();          // after the tokens, so migration sees them
}

/* ============================================================
   PLAYBOOK
   ============================================================ */
function Playbook({ db, setDB, coach }) {
  const plays = db.plays;
  const [playId, setPlayId] = useState(plays[0]?.id);
  const play = plays.find(p => p.id === playId) || plays[0];
  const [frameIdx, setFrameIdx] = useState(0);
  const [playing, setPlaying] = useState(false);
  const [t, setT] = useState(0);
  const [speed, setSpeed] = useState(1);
  const [loop, setLoop] = useState(true);
  const [editing, setEditing] = useState(false);
  const [tool, setTool] = useState('select');
  const [selected, setSelected] = useState(null);
  const [showGhost, setShowGhost] = useState(true);
  const [libOpen, setLibOpen] = useState(false);
  const [meta, setMeta] = useState(null);

  const frames = useMemo(() => (play ? framesOf(play) : []), [play]);
  const fIdx = Math.min(frameIdx, Math.max(0, frames.length - 1));
  const [dragStep, setDragStep] = useState(null);

  useEffect(() => { setFrameIdx(0); setT(0); setPlaying(false); setEditing(false); setSelected(null); setTool('select'); }, [playId]);
  useEffect(() => { if (!coach) { setEditing(false); setTool('select'); } }, [coach]);

  /* animation loop */
  const raf = useRef(0);
  const idxRef = useRef(0), tRef = useRef(0);
  idxRef.current = fIdx;
  useEffect(() => {
    if (!playing || frames.length < 2) return;
    let prev = performance.now();
    let idx = idxRef.current >= frames.length - 1 ? 0 : idxRef.current;
    let tt = 0;
    const dur = 1150 / speed;
    setFrameIdx(idx); setT(0);
    const step = (now) => {
      const dt = Math.min(64, now - prev); prev = now;
      tt += dt / dur;
      while (tt >= 1) {
        tt -= 1;
        if (idx + 1 <= frames.length - 2) { idx += 1; }
        else if (loop) { idx = 0; }
        else { setFrameIdx(frames.length - 1); setT(0); setPlaying(false); return; }
      }
      tRef.current = tt;
      setFrameIdx(idx); setT(tt);
      raf.current = requestAnimationFrame(step);
    };
    raf.current = requestAnimationFrame(step);
    return () => cancelAnimationFrame(raf.current);
  }, [playing, speed, loop, frames.length]);

  const displayed = useMemo(() => {
    if (!frames.length) return { pos: clone(BLANK_POS), ballAt: null, draws: [], op: 1 };
    const a = frames[fIdx];
    const b = frames[fIdx + 1];
    if (!playing || !b) return { pos: a.pos, ballAt: a.ballXY, draws: a.draws, op: 1 };
    const e = easeInOut(Math.min(1, t));
    const pos = {};
    ALL_TOKENS.forEach(k => {
      const pa = a.pos[k], pb = b.pos[k] || pa;
      if (pa) pos[k] = [lerp(pa[0], pb[0], e), lerp(pa[1], pb[1], e)];
    });
    // the ball travels between holders, which is exactly what a pass looks like
    const ballAt = a.ballXY && b.ballXY
      ? [lerp(a.ballXY[0], b.ballXY[0], e), lerp(a.ballXY[1], b.ballXY[1], e)]
      : (a.ballXY || null);
    return { pos, ballAt, draws: a.draws, op: Math.max(0, 1 - e * 1.35) };
  }, [frames, fIdx, t, playing]);

  /* mutations */
  const mutate = (fn) => setDB(d => {
    const nd = clone(d);
    const p = nd.plays.find(x => x.id === play.id);
    fn(p, nd);
    return nd;
  });
  /* Dragging a player edits the setup (frame 0) or the step that produced this
     frame. Nothing needs doing for the ball — it is drawn off whoever holds
     it, so it moves with him automatically. */
  const moveToken = (id, xy) => mutate(p => {
    const target = fIdx === 0 ? p.start : p.steps[fIdx - 1].moves;
    target[id] = xy;
  });

  // hand the ball to someone — on the setup, or as a step if we're further in
  const assignBall = (who) => {
    if (frames[fIdx] && frames[fIdx].ball === who) return;
    mutate(p => { if (fIdx === 0) p.ball = who; else p.steps[fIdx - 1].ball = who; });
  };

  /* Drawing a movement IS creating a step. The line tells us who moves and
     where to, so we insert a step here rather than making the coach add one
     by hand and drag the player a second time. */
  const addDraw = (d) => {
    const cur = frames[fIdx].pos;
    const near = (pt) => {
      let best = null, bd = Infinity;
      ALL_TOKENS.forEach(t => {
        if (!cur[t]) return;
        const dd = Math.hypot(cur[t][0] - pt[0], cur[t][1] - pt[1]);
        if (dd < bd) { bd = dd; best = t; }
      });
      return bd <= 52 ? best : null;
    };
    const end = d.pts[d.pts.length - 1];

    if (d.tool === 'pass') {
      // a pass is a change of possession, and it always lands on somebody
      const receiver = nearestPlayer(cur, end);
      const line = { ...d, pts: [...d.pts.slice(0, -1), ballXY(cur, receiver)] };
      mutate(p => p.steps.splice(fIdx, 0, {
        id: uid(), label: `Pass to ${receiver}`, moves: {}, ball: receiver, draws: [line] }));
      setFrameIdx(fIdx + 1); setPlaying(false);
      return;
    }

    const subject = near(d.pts[0]);
    if (!subject) {                       // freehand mark, nobody moves
      mutate(p => {
        if (p.steps[fIdx]) p.steps[fIdx].draws.push(d);
        else p.steps.push({ id: uid(), label: 'Note', moves: {}, draws: [d] });
      });
      return;
    }
    const label = d.tool === 'screen' ? `${subject} screens` : `${subject} cuts`;
    mutate(p => p.steps.splice(fIdx, 0, {
      id: uid(), label, moves: { [subject]: [end[0], end[1]] }, draws: [d] }));
    setFrameIdx(fIdx + 1);
    setPlaying(false);
  };

  const undoDraw = () => mutate(p => { const s = p.steps[fIdx]; if (s) s.draws.pop(); });
  const clearDraws = () => mutate(p => { const s = p.steps[fIdx]; if (s) s.draws = []; });

  const addStep = () => {
    mutate(p => p.steps.splice(fIdx, 0, { id: uid(), label: `Step ${p.steps.length + 1}`, moves: {}, draws: [] }));
    setFrameIdx(fIdx + 1); setPlaying(false);
  };
  const delStep = (i) => {
    mutate(p => p.steps.splice(i, 1));
    setFrameIdx(x => Math.max(0, Math.min(x, frames.length - 2)));
  };
  /* merging folds a step into the one before it, so both sets of movement
     play out at the same time instead of one after the other */
  const mergeUp = (i) => mutate(p => {
    if (i < 1 || !p.steps[i]) return;
    const a = p.steps[i - 1], b = p.steps[i];
    a.moves = { ...a.moves, ...b.moves };
    a.draws = [...a.draws, ...b.draws];
    if (b.ball) a.ball = b.ball;                 // possession change carries over
    a.label = `${a.label} + ${b.label}`;
    p.steps.splice(i, 1);
  });
  const moveStep = (from, to) => {
    if (from === to || to < 0 || to > frames.length - 2) return;
    mutate(p => { const [s] = p.steps.splice(from, 1); p.steps.splice(to, 0, s); });
  };
  const resetSetup = () => { mutate(p => { p.start = clone(BLANK_POS); p.ball = 'O1'; }); setFrameIdx(0); };
  const renameStep = (i, v) => mutate(p => { if (p.steps[i]) p.steps[i].label = v; });

  const createPlay = () => { const np = newPlay(); setDB(d => ({ ...d, plays: [...d.plays, np] })); setPlayId(np.id); setEditing(true); setMeta(np); };
  const dupPlay = () => {
    const np = clone(play); np.id = uid(); np.name = play.name + ' (copy)'; np.steps.forEach(s => s.id = uid());
    setDB(d => ({ ...d, plays: [...d.plays, np] })); setPlayId(np.id);
  };
  const delPlay = () => {
    if (!confirm(`Delete "${play.name}"?`)) return;
    setDB(d => { const ps = d.plays.filter(p => p.id !== play.id); return { ...d, plays: ps.length ? ps : [newPlay()] }; });
    setPlayId(plays.find(p => p.id !== play.id)?.id);
  };
  const saveMeta = () => { const m = meta; setDB(d => ({ ...d, plays: d.plays.map(p => p.id === m.id ? { ...p, name: m.name, tags: m.tags, desc: m.desc, coaching: m.coaching } : p) })); setMeta(null); };

  if (!play) return null;

  const TOOLS = [
    { k:'select', icon:'move',  label:'Move players' },
    { k:'move',   icon:'route', label:'Cut / drive line' },
    { k:'pass',   icon:'forward', label:'Pass arrow' },
    { k:'screen', icon:'minus', label:'Screen' },
  ];

  return (
    <div className="space-y-4">
      {/* play selector */}
      <Card className="p-3">
        <div className="flex items-center gap-2">
          <div className="flex-1 min-w-0">
            <button onClick={() => setLibOpen(o => !o)} className="w-full text-left group">
              <div className="flex items-center gap-2">
                <span className="shrink-0 w-9 h-9 rounded-xl bg-navy text-gold grid place-items-center"><Icon n="film" s={17}/></span>
                <span className="min-w-0">
                  <span className="block font-extrabold text-navy truncate leading-tight">{play.name}</span>
                  <span className="block text-[11px] text-slate-500 truncate">{play.tags} · {play.steps.length} steps</span>
                </span>
                <span className={cx('ml-auto text-slate-400 transition', libOpen && 'rotate-180')}><Icon n="chevD" s={18}/></span>
              </div>
            </button>
          </div>
        </div>
        {libOpen && (
          <div className="mt-3 pt-3 border-t border-slate-100 space-y-1.5 fade-in">
            {plays.map(p => (
              <button key={p.id} onClick={() => { setPlayId(p.id); setLibOpen(false); }}
                className={cx('w-full flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-left transition',
                  p.id === play.id ? 'bg-navy text-white' : 'bg-slate-50 hover:bg-slate-100 text-navy')}>
                <Icon n="target" s={15} className={p.id === play.id ? 'text-gold' : 'text-slateb'} />
                <span className="min-w-0 flex-1">
                  <span className="block text-sm font-bold truncate">{p.name}</span>
                  <span className={cx('block text-[11px] truncate', p.id === play.id ? 'text-slate-300' : 'text-slate-500')}>{p.tags} · {p.steps.length} steps</span>
                </span>
              </button>
            ))}
            {coach && (
              <div className="flex gap-2 pt-2">
                <Btn size="sm" variant="gold" icon="plus" onClick={createPlay} className="flex-1">New play</Btn>
                <Btn size="sm" variant="ghost" icon="copy" onClick={dupPlay} className="flex-1">Duplicate</Btn>
              </div>
            )}
          </div>
        )}
      </Card>

      {/* court */}
      <div className="rounded-2xl overflow-hidden shadow-card">
        <Court pos={displayed.pos} ballAt={displayed.ballAt} draws={displayed.draws} drawOpacity={displayed.op}
          editing={editing} tool={tool} selected={selected} onSelect={setSelected}
          onMove={moveToken} onDraw={addDraw} onBallAssign={assignBall}
          ghost={editing && showGhost && !playing ? frames[fIdx + 1] : null} />
      </div>

      {/* transport */}
      <Card className="p-3">
        <div className="flex items-center gap-2">
          <Btn variant="ghost" size="sm" onClick={() => { setFrameIdx(0); setT(0); }} title="Back to step 1"><Icon n="rewind" s={15}/></Btn>
          <button onClick={() => { if (frames.length < 2) return; setEditing(false); setPlaying(p => !p); }}
            disabled={frames.length < 2}
            className="w-12 h-12 rounded-2xl bg-gold text-navy grid place-items-center shadow-sm active:scale-95 transition disabled:opacity-40">
            <Icon n={playing ? 'pause' : 'play'} s={20} fill={playing ? 'none' : 'currentColor'} />
          </button>
          <div className="flex-1 min-w-0">
            <div className="flex items-center gap-1 overflow-x-auto no-scrollbar pb-0.5">
              {frames.map((f, i) => (
                <button key={f.key} onClick={() => { setPlaying(false); setFrameIdx(i); setT(0); }}
                  className={cx('shrink-0 px-2.5 py-1.5 rounded-lg text-[11px] font-extrabold transition',
                    i === fIdx ? 'bg-navy text-white' : 'bg-slate-100 text-slate-500 hover:bg-slate-200')}>
                  {i + 1}
                </button>
              ))}
            </div>
            <div className="mt-1.5 h-1 rounded-full bg-slate-100 overflow-hidden">
              <div className="h-full bg-slateb transition-none" style={{ width: `${((fIdx + (playing ? t : 0)) / Math.max(1, frames.length - 1)) * 100}%` }} />
            </div>
          </div>
          <button onClick={() => setLoop(l => !l)} title="Loop"
            className={cx('w-9 h-9 rounded-xl grid place-items-center transition', loop ? 'bg-slateb text-white' : 'bg-slate-100 text-slate-400')}>
            <Icon n="repeat" s={15}/>
          </button>
          <select value={speed} onChange={e => setSpeed(+e.target.value)}
            className="rounded-xl border border-slate-200 text-xs font-bold text-navy px-1.5 py-2 outline-none">
            <option value={0.5}>0.5×</option><option value={1}>1×</option><option value={1.5}>1.5×</option><option value={2}>2×</option>
          </select>
        </div>
        <div className="mt-2.5 flex items-center justify-between gap-2">
          <p className="text-xs text-slate-500 truncate">
            <span className="font-extrabold text-navy">Step {fIdx + 1}</span>
            <span className="mx-1.5 text-slate-300">·</span>{frames[fIdx]?.label || ''}
          </p>
          <div className="flex items-center gap-1.5 shrink-0">
            {coach && <Btn size="sm" variant={editing ? 'gold' : 'ghost'} icon={editing ? 'check' : 'pencil'}
              onClick={() => { setEditing(e => !e); setPlaying(false); }}>{editing ? 'Done' : 'Edit'}</Btn>}
          </div>
        </div>
      </Card>

      {/* editor */}
      {coach && editing && (
        <Card className="p-3 space-y-3 fade-in border-gold/40">
          <div className="flex items-center gap-1.5 overflow-x-auto no-scrollbar">
            {TOOLS.map(tl => (
              <button key={tl.k} onClick={() => setTool(tl.k)} title={tl.label}
                className={cx('shrink-0 inline-flex items-center gap-1.5 px-2.5 py-2 rounded-xl text-xs font-bold transition border',
                  tool === tl.k ? 'bg-navy text-white border-navy' : 'bg-white text-navy border-slate-200 hover:bg-slate-50')}>
                <Icon n={tl.icon} s={14}/>{tl.label.split(' ')[0]}
              </button>
            ))}
            <span className="shrink-0 ml-auto flex items-center gap-1.5 pl-2">
              <Btn size="sm" variant="ghost" icon="undo" onClick={undoDraw} title="Undo last line" />
              <Btn size="sm" variant="ghost" onClick={clearDraws} title="Clear lines"><Icon n="trash" s={13}/></Btn>
            </span>
          </div>
          <p className="text-[11px] text-slate-500 leading-relaxed bg-slate-50 rounded-xl px-3 py-2">
            {tool === 'select'
              ? 'Drag players to fix their spots. Drag the ball onto a player to hand him possession — it always travels with whoever is holding it.'
              : tool === 'pass'
                ? 'Draw from the ball to a team-mate. Releasing hands him possession as a new step — a pass always lands on somebody.'
                : 'Draw from a player — the line snaps to him. Releasing creates a step that moves him there, ball included if he has it. Merge steps below to run them at once.'}
          </p>

          {/* step list — reorder by dragging, merge to run together */}
          <div>
            <div className="flex items-center justify-between mb-1.5">
              <span className="text-[10px] font-black uppercase tracking-wider text-slate-400">Steps</span>
              <span className="text-[10px] text-slate-400">drag to reorder</span>
            </div>
            <div className="space-y-1.5 max-h-64 overflow-y-auto no-scrollbar">
              {!play.steps.length && (
                <p className="text-[11px] text-slate-400 text-center py-4 border border-dashed border-slate-200 rounded-xl">
                  {"No steps yet — pick a line tool and draw a player's movement."}
                </p>
              )}
              {play.steps.map((s, i) => {
                const toks = stepTokens(s);
                return (
                  <div key={s.id} draggable
                    onDragStart={() => setDragStep(i)}
                    onDragOver={e => e.preventDefault()}
                    onDrop={() => { if (dragStep !== null) moveStep(dragStep, i); setDragStep(null); }}
                    onDragEnd={() => setDragStep(null)}
                    className={cx('flex items-center gap-1.5 rounded-xl border px-2 py-1.5 bg-white transition',
                      dragStep === i && 'opacity-40',
                      fIdx === i + 1 ? 'border-navy ring-2 ring-navy/10' : 'border-slate-200')}>
                    <span className="shrink-0 text-slate-300 cursor-grab active:cursor-grabbing"><Icon n="grip" s={14}/></span>
                    <button onClick={() => { setPlaying(false); setFrameIdx(i + 1); setT(0); }} className="min-w-0 flex-1 text-left">
                      <span className="block text-xs font-bold text-navy truncate">{i + 1}. {s.label}</span>
                      <span className="flex items-center gap-1 mt-0.5 flex-wrap">
                        {!toks.length
                          ? <span className="text-[9px] text-slate-400 font-bold">no movement</span>
                          : toks.map(t => (
                            <span key={t} className={cx('px-1.5 py-0.5 rounded text-[9px] font-black leading-none',
                              t === 'BALL' ? 'bg-orange-100 text-orange-700' : 'bg-gold/25 text-gold-600')}>
                              {t}
                            </span>))}
                        {toks.length > 1 && <span className="text-[9px] font-black uppercase tracking-wide text-slateb">together</span>}
                      </span>
                    </button>
                    <button onClick={() => mergeUp(i)} disabled={i === 0} title="Run at the same time as the step above"
                      className="shrink-0 p-1.5 rounded-lg text-slateb hover:bg-slateb/10 disabled:opacity-20 disabled:pointer-events-none"><Icon n="merge" s={13}/></button>
                    <span className="shrink-0 flex flex-col -space-y-1">
                      <button onClick={() => moveStep(i, i - 1)} disabled={i === 0}
                        className="p-0.5 text-slate-400 hover:text-navy disabled:opacity-20"><Icon n="chevU" s={12}/></button>
                      <button onClick={() => moveStep(i, i + 1)} disabled={i === play.steps.length - 1}
                        className="p-0.5 text-slate-400 hover:text-navy disabled:opacity-20"><Icon n="chevD" s={12}/></button>
                    </span>
                    <button onClick={() => delStep(i)}
                      className="shrink-0 p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon n="x" s={13}/></button>
                  </div>
                );
              })}
            </div>
          </div>

          <div className="flex flex-wrap gap-1.5">
            <Btn size="sm" variant="ghost" icon="plus" onClick={addStep}>Blank step</Btn>
            <Btn size="sm" variant="ghost" onClick={resetSetup}>Reset spots</Btn>
            <button onClick={() => setShowGhost(g => !g)}
              className={cx('px-2.5 py-1.5 rounded-xl text-xs font-bold border transition',
                showGhost ? 'bg-slateb text-white border-slateb' : 'bg-white text-navy border-slate-200')}>Next-step ghost</button>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
            <Field label={fIdx === 0 ? 'Starting alignment' : `Step ${fIdx} name`}>
              <input className={inputCls} disabled={fIdx === 0}
                value={fIdx === 0 ? 'Set' : (play.steps[fIdx - 1]?.label || '')}
                onChange={e => renameStep(fIdx - 1, e.target.value)} />
            </Field>
            <div className="flex items-end gap-2">
              <Btn variant="ghost" icon="sliders" className="flex-1" onClick={() => setMeta(clone(play))}>Play details</Btn>
              <Btn variant="danger" icon="trash" onClick={delPlay}>Delete</Btn>
            </div>
          </div>
        </Card>
      )}

      {/* legend + notes */}
      <Card className="p-4">
        <SectionTitle icon="whistle">How we run it</SectionTitle>
        {play.desc && <p className="text-sm text-slate-600 leading-relaxed mb-3">{play.desc}</p>}
        {!!(play.coaching || []).length && (
          <ul className="space-y-1.5 mb-3">
            {play.coaching.map((c, i) => (
              <li key={i} className="flex gap-2 text-sm text-navy">
                <span className="mt-1.5 w-1.5 h-1.5 rounded-full bg-gold shrink-0" />{c}
              </li>
            ))}
          </ul>
        )}
        <div className="flex flex-wrap gap-x-4 gap-y-2 pt-3 border-t border-slate-100">
          {[['#E5A823', 'Player', '#0E1F38'],
            [ACTIVE_SPORT.ballColor, 'Ball', ACTIVE_SPORT.ballStroke]].map(([c, l, ring]) => (
            <span key={l} className="inline-flex items-center gap-1.5 text-[11px] font-bold text-slate-600">
              <span className="w-3 h-3 rounded-full" style={{ background: c, boxShadow: `inset 0 0 0 1.5px ${ring}` }} />{l}</span>
          ))}
          {Object.entries(DRAW_STYLE).map(([k, v]) => (
            <span key={k} className="inline-flex items-center gap-1.5 text-[11px] font-bold text-slate-600">
              <svg width="22" height="8"><line x1="1" y1="4" x2="21" y2="4" stroke={v.color} strokeWidth="3" strokeDasharray={v.dash} strokeLinecap="round"/></svg>
              {v.label}</span>
          ))}
        </div>
      </Card>

      {/* play meta modal */}
      <Modal open={!!meta} onClose={() => setMeta(null)} title="Play details">
        {meta && <div className="space-y-3">
          <Field label="Play name"><input className={inputCls} value={meta.name} onChange={e => setMeta({ ...meta, name: e.target.value })} /></Field>
          <Field label="Category"><input className={inputCls} placeholder="Offense · Half Court" value={meta.tags} onChange={e => setMeta({ ...meta, tags: e.target.value })} /></Field>
          <Field label="Description"><textarea rows="3" className={inputCls} value={meta.desc} onChange={e => setMeta({ ...meta, desc: e.target.value })} /></Field>
          <Field label="Coaching points (one per line)">
            <textarea rows="4" className={inputCls} value={(meta.coaching || []).join('\n')}
              onChange={e => setMeta({ ...meta, coaching: e.target.value.split('\n').filter(Boolean) })} /></Field>
          <div className="flex gap-2 pt-1">
            <Btn variant="ghost" className="flex-1" onClick={() => setMeta(null)}>Cancel</Btn>
            <Btn variant="primary" icon="save" className="flex-1" onClick={saveMeta}>Save</Btn>
          </div>
        </div>}
      </Modal>
    </div>
  );
}

/* ============================================================
   ROSTER
   ============================================================ */
const POS_TONE = { PG:'bg-gold text-navy', SG:'bg-slateb text-white', SF:'bg-slateb-600 text-white',
                   PF:'bg-navy text-white', C:'bg-navy-900 text-white',
                   A:'bg-gold text-navy', M:'bg-slateb text-white', D:'bg-navy text-white',
                   LSM:'bg-slateb-600 text-white', FOGO:'bg-navy-600 text-white', G:'bg-navy-900 text-white' };
const byNum = (a, b) => (parseInt(a.num || 999) - parseInt(b.num || 999)) || a.name.localeCompare(b.name);

function Roster({ db, setDB, coach }) {
  const [edit, setEdit] = useState(null);
  const [bulk, setBulk] = useState(false);
  const [bulkText, setBulkText] = useState('');
  const [q, setQ] = useState('');

  const list = [...db.roster].sort(byNum).filter(p =>
    !q || (p.name + p.num + p.pos).toLowerCase().includes(q.toLowerCase()));

  const save = () => {
    const p = edit;
    if (!p.name.trim()) return;
    setDB(d => ({ ...d, roster: d.roster.some(x => x.id === p.id) ? d.roster.map(x => x.id === p.id ? p : x) : [...d.roster, p] }));
    setEdit(null);
  };
  const del = (id) => { if (confirm('Remove this player from the roster?')) setDB(d => ({ ...d, roster: d.roster.filter(p => p.id !== id) })); setEdit(null); };
  const runBulk = () => {
    const rows = bulkText.split('\n').map(l => l.trim()).filter(Boolean).map(l => {
      const c = l.split(/\t|,/).map(s => s.trim());
      return { id: uid(), num: (c[0] || '').replace('#',''), name: c[1] || '', pos: (POSITIONS.includes((c[2] || '').toUpperCase()) ? c[2].toUpperCase() : POSITIONS[0]), parent: c[3] || '', phone: c[4] || '' };
    }).filter(r => r.name);
    if (!rows.length) return;
    setDB(d => ({ ...d, roster: rows }));
    setBulkText(''); setBulk(false);
  };

  return (
    <div className="space-y-4">
      <Card className="p-4">
        <SectionTitle icon="users" right={<span className="text-xs font-bold text-slate-400">{db.roster.length} players</span>}>Team Roster</SectionTitle>
        <div className="relative mb-3">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"><Icon n="search" s={15}/></span>
          <input className={cx(inputCls, 'pl-9')} placeholder="Search players…" value={q} onChange={e => setQ(e.target.value)} />
        </div>
        {coach && <div className="flex gap-2 mb-3">
          <Btn size="sm" variant="gold" icon="plus" className="flex-1"
            onClick={() => setEdit({ id: uid(), num:'', name:'', pos: POSITIONS[0], parent:'', phone:'' })}>Add player</Btn>
          <Btn size="sm" variant="ghost" icon="upload" className="flex-1" onClick={() => setBulk(true)}>Paste roster</Btn>
        </div>}
        {!list.length ? <Empty icon="users" title="No players yet" sub={coach ? 'Add players one at a time, or paste your whole roster at once.' : 'Your coach has not posted the roster yet.'} />
          : <div className="divide-y divide-slate-100 -mx-1">
            {list.map(p => (
              <div key={p.id} className="flex items-center gap-3 py-2.5 px-1">
                <span className="shrink-0 w-10 h-10 rounded-xl bg-navy text-gold grid place-items-center font-black text-sm">{p.num || '–'}</span>
                <div className="min-w-0 flex-1">
                  <p className="font-bold text-navy text-sm truncate">{p.name}</p>
                  {coach && (p.parent || p.phone) &&
                    <p className="text-[11px] text-slate-500 truncate flex items-center gap-1"><Icon n="phone" s={11}/>{[p.parent, p.phone].filter(Boolean).join(' · ')}</p>}
                </div>
                <span className={cx('shrink-0 px-2 py-1 rounded-lg text-[10px] font-black tracking-wide', POS_TONE[p.pos] || 'bg-slate-100 text-slate-500')}>{p.pos}</span>
                {coach && <button onClick={() => setEdit(p)} className="shrink-0 p-2 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-navy"><Icon n="pencil" s={15}/></button>}
              </div>
            ))}
          </div>}
      </Card>

      <Modal open={!!edit} onClose={() => setEdit(null)} title={db.roster.some(p => p.id === edit?.id) ? 'Edit player' : 'Add player'}>
        {edit && <div className="space-y-3">
          <div className="grid grid-cols-3 gap-2">
            <Field label="#"><input className={inputCls} value={edit.num} onChange={e => setEdit({ ...edit, num: e.target.value })} /></Field>
            <Field label="Name" className="col-span-2"><input className={inputCls} value={edit.name} onChange={e => setEdit({ ...edit, name: e.target.value })} /></Field>
          </div>
          <Field label="Position">
            <div className="flex flex-wrap gap-1.5">
              {POSITIONS.map(p => (
                <button key={p} onClick={() => setEdit({ ...edit, pos: p })}
                  className={cx('flex-1 min-w-[52px] py-2 rounded-xl text-xs font-black transition', edit.pos === p ? 'bg-navy text-white' : 'bg-slate-100 text-slate-500')}>{p}</button>
              ))}
            </div>
          </Field>
          <Field label="Parent / Guardian"><input className={inputCls} value={edit.parent} onChange={e => setEdit({ ...edit, parent: e.target.value })} /></Field>
          <Field label="Contact"><input className={inputCls} placeholder="(843) 555-0100" value={edit.phone} onChange={e => setEdit({ ...edit, phone: e.target.value })} /></Field>
          <div className="flex gap-2 pt-1">
            {db.roster.some(p => p.id === edit.id) && <Btn variant="danger" icon="trash" onClick={() => del(edit.id)}>Remove</Btn>}
            <Btn variant="primary" icon="save" className="flex-1" onClick={save}>Save player</Btn>
          </div>
        </div>}
      </Modal>

      <Modal open={bulk} onClose={() => setBulk(false)} title="Paste your roster" wide>
        <p className="text-xs text-slate-500 mb-2 leading-relaxed">One player per line, comma or tab separated. This <b>replaces</b> the current roster.</p>
        <pre className="text-[11px] bg-slate-50 rounded-xl p-3 mb-3 text-slate-500 overflow-x-auto">#, Name, Position, Parent, Phone{'\n'}3, Marcus Bell, PG, Angela Bell, (843) 555-0101</pre>
        <textarea rows="9" className={cx(inputCls, 'font-mono text-xs')} value={bulkText} onChange={e => setBulkText(e.target.value)} placeholder="3, Marcus Bell, PG, Angela Bell, (843) 555-0101" />
        <div className="flex gap-2 pt-3">
          <Btn variant="ghost" className="flex-1" onClick={() => setBulk(false)}>Cancel</Btn>
          <Btn variant="primary" icon="upload" className="flex-1" onClick={runBulk}>Import roster</Btn>
        </div>
      </Modal>
    </div>
  );
}

/* ============================================================
   ATTENDANCE
   ============================================================ */
const ATT = [
  { k:'present', label:'Present', tone:'bg-emerald-500', soft:'bg-emerald-50 text-emerald-700 border-emerald-200' },
  { k:'late',    label:'Late',    tone:'bg-amber-500',   soft:'bg-amber-50 text-amber-700 border-amber-200' },
  { k:'absent',  label:'Absent',  tone:'bg-red-500',     soft:'bg-red-50 text-red-600 border-red-200' },
];
function Attendance({ db, setDB }) {
  const events = [...db.events].sort((a, b) => b.date.localeCompare(a.date));
  const [eid, setEid] = useState(events[0]?.id || '');
  const ev = events.find(e => e.id === eid);
  const rec = db.attendance[eid] || {};
  const roster = [...db.roster].sort(byNum);

  const set = (pid, v) => setDB(d => ({ ...d, attendance: { ...d.attendance, [eid]: { ...(d.attendance[eid] || {}), [pid]: v } } }));
  const allPresent = () => setDB(d => ({ ...d, attendance: { ...d.attendance, [eid]: Object.fromEntries(d.roster.map(p => [p.id, 'present'])) } }));
  const clearAll = () => setDB(d => ({ ...d, attendance: { ...d.attendance, [eid]: {} } }));
  const count = k => roster.filter(p => rec[p.id] === k).length;

  if (!events.length) return <Card className="p-4"><Empty icon="clipboard" title="No events yet" sub="Add a practice or game on the Schedule tab first." /></Card>;

  return (
    <div className="space-y-4">
      <Card className="p-4">
        <SectionTitle icon="clipboard">Attendance</SectionTitle>
        <select value={eid} onChange={e => setEid(e.target.value)} className={cx(inputCls, 'font-semibold')}>
          {events.map(e => <option key={e.id} value={e.id}>{eventLabel(e)}</option>)}
        </select>
        {ev && <p className="text-[11px] text-slate-500 mt-2 flex items-center gap-1"><Icon n="pin" s={12}/>{ev.location} · {fmtTime(ev.time)}</p>}
        <div className="grid grid-cols-4 gap-2 mt-3">
          {ATT.map(a => (
            <div key={a.k} className="rounded-xl bg-slate-50 py-2 text-center">
              <p className="text-lg font-black text-navy leading-none">{count(a.k)}</p>
              <p className="text-[10px] font-bold uppercase tracking-wider text-slate-500 mt-1">{a.label}</p>
            </div>
          ))}
          <div className="rounded-xl bg-navy py-2 text-center">
            <p className="text-lg font-black text-gold leading-none">{roster.length - count('present') - count('late') - count('absent')}</p>
            <p className="text-[10px] font-bold uppercase tracking-wider text-slate-300 mt-1">Unset</p>
          </div>
        </div>
        <div className="flex gap-2 mt-3">
          <Btn size="sm" variant="ghost" icon="check" className="flex-1" onClick={allPresent}>All present</Btn>
          <Btn size="sm" variant="ghost" icon="undo" className="flex-1" onClick={clearAll}>Clear</Btn>
        </div>
      </Card>

      <Card className="p-2">
        {!roster.length ? <Empty icon="users" title="Roster is empty" sub="Add players first." /> :
          <div className="divide-y divide-slate-100">
            {roster.map(p => (
              <div key={p.id} className="flex items-center gap-2 p-2">
                <span className="shrink-0 w-8 h-8 rounded-lg bg-slate-100 text-navy grid place-items-center font-black text-xs">{p.num || '–'}</span>
                <p className="flex-1 min-w-0 text-sm font-bold text-navy truncate">{p.name}</p>
                <div className="flex gap-1 shrink-0">
                  {ATT.map(a => (
                    <button key={a.k} onClick={() => set(p.id, rec[p.id] === a.k ? undefined : a.k)}
                      className={cx('w-9 h-9 rounded-xl text-[10px] font-black transition border',
                        rec[p.id] === a.k ? cx(a.tone, 'text-white border-transparent shadow-sm') : 'bg-white text-slate-400 border-slate-200 hover:bg-slate-50')}>
                      {a.label[0]}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>}
      </Card>
    </div>
  );
}

/* ============================================================
   SCHEDULE
   ============================================================ */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const isoDay = (y, m, d) => `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;

function Schedule({ db, setDB, coach }) {
  const [edit, setEdit] = useState(null);
  const [openNote, setOpenNote] = useState(null);
  const [view, setView] = useState('calendar');
  const today = new Date().toISOString().slice(0, 10);
  // open on the month of the next event rather than today, so the calendar
  // isn't blank when the season hasn't started yet
  const nextUp = useMemo(() => [...db.events].sort((a, b) => a.date.localeCompare(b.date)).find(e => e.date >= today), [db.events, today]);
  const [cursor, setCursor] = useState(() => {
    const d = nextUp ? new Date(nextUp.date + 'T12:00:00') : new Date();
    return { y: d.getFullYear(), m: d.getMonth() };
  });
  const [selDay, setSelDay] = useState(nextUp ? nextUp.date : today);
  const sorted = [...db.events].sort((a, b) => a.date.localeCompare(b.date));
  const upcoming = sorted.filter(e => e.date >= today);
  const past = sorted.filter(e => e.date < today).reverse();

  const save = () => {
    const e = edit; if (!e.date) return;
    setDB(d => ({ ...d, events: d.events.some(x => x.id === e.id) ? d.events.map(x => x.id === e.id ? e : x) : [...d.events, e] }));
    setEdit(null);
  };
  const del = (id) => { if (confirm('Delete this event?')) { setDB(d => ({ ...d, events: d.events.filter(e => e.id !== id) })); setEdit(null); } };
  const setNote = (id, v) => setDB(d => ({ ...d, notes: { ...d.notes, [id]: v } }));

  const Row = ({ e }) => {
    const g = db.games[e.id];
    const isGame = e.type === 'Game';
    const res = g && g.us !== '' && g.them !== '' ? (+g.us > +g.them ? 'W' : +g.us < +g.them ? 'L' : 'T') : null;
    return (
      <div className="p-3.5">
        <div className="flex items-start gap-3">
          <div className={cx('shrink-0 w-12 rounded-xl text-center py-1.5', isGame ? 'bg-navy text-white' : 'bg-slate-100 text-navy')}>
            <p className="text-[9px] font-black uppercase tracking-wider opacity-70">{new Date(e.date + 'T12:00:00').toLocaleDateString(undefined, { month:'short' })}</p>
            <p className="text-lg font-black leading-none">{new Date(e.date + 'T12:00:00').getDate()}</p>
          </div>
          <div className="min-w-0 flex-1">
            <div className="flex items-center gap-1.5 flex-wrap">
              <Pill tone={isGame ? 'gold' : 'blue'}>{e.type}</Pill>
              {res && <Pill tone={res === 'W' ? 'green' : res === 'L' ? 'red' : 'amber'}>{res} {g.us}–{g.them}</Pill>}
            </div>
            <p className="font-extrabold text-navy text-sm mt-1 truncate">{isGame ? (e.opponent || 'TBD') : 'Team Practice'}</p>
            <p className="text-[11px] text-slate-500 flex items-center gap-2.5 mt-0.5 flex-wrap">
              <span className="inline-flex items-center gap-1"><Icon n="clock" s={11}/>{fmtTime(e.time)}</span>
              <span className="inline-flex items-center gap-1"><Icon n="pin" s={11}/>{e.location}</span>
            </p>
            {e.note && <p className="text-[11px] text-slateb mt-1.5 bg-slateb/5 rounded-lg px-2 py-1 inline-block">{e.note}</p>}
          </div>
          {coach && <div className="shrink-0 flex flex-col gap-1">
            <button onClick={() => setEdit(e)} className="p-2 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-navy"><Icon n="pencil" s={15}/></button>
            <button onClick={() => setOpenNote(openNote === e.id ? null : e.id)}
              className={cx('p-2 rounded-lg', db.notes[e.id] ? 'text-gold-600 bg-gold/10' : 'text-slate-400 hover:bg-slate-100')}><Icon n="note" s={15}/></button>
          </div>}
        </div>
        {coach && openNote === e.id && (
          <div className="mt-2.5 fade-in">
            <div className="flex items-center gap-1.5 mb-1.5 text-[10px] font-black uppercase tracking-wider text-gold-600">
              <Icon n="lock" s={11}/> Coach-only notes
            </div>
            <textarea rows="3" className={cx(inputCls, 'bg-slate-50')} placeholder="e.g. Focus on defensive transition next practice…"
              value={db.notes[e.id] || ''} onChange={ev2 => setNote(e.id, ev2.target.value)} />
          </div>
        )}
      </div>
    );
  };

  return (
    <div className="space-y-4">
      {coach && <Btn variant="gold" icon="plus" className="w-full" size="lg"
        onClick={() => setEdit({ id: uid(), type:'Practice', date: today, time:'17:30', opponent:'', location:'Buist Gym', note:'' })}>Add event</Btn>}

      <div className="grid grid-cols-2 gap-1.5 p-1 bg-slate-100 rounded-xl">
        {[['calendar','Calendar','calendar'],['list','List','clipboard']].map(([k, l, ic]) => (
          <button key={k} onClick={() => setView(k)}
            className={cx('inline-flex items-center justify-center gap-1.5 py-2 rounded-lg text-xs font-extrabold transition',
              view === k ? 'bg-white text-navy shadow-sm' : 'text-slate-500')}>
            <Icon n={ic} s={14}/>{l}
          </button>
        ))}
      </div>

      {view === 'calendar' && (() => {
        const { y, m } = cursor;
        const startDow = new Date(y, m, 1).getDay();
        const days = new Date(y, m + 1, 0).getDate();
        const cells = [...Array(startDow).fill(null), ...Array.from({ length: days }, (_, i) => i + 1)];
        while (cells.length % 7) cells.push(null);
        const byDate = {};
        db.events.forEach(e => { (byDate[e.date] = byDate[e.date] || []).push(e); });
        const dayEvents = (byDate[selDay] || []).sort((a, b) => (a.time || '').localeCompare(b.time || ''));
        const shift = (n) => { const d = new Date(y, m + n, 1); setCursor({ y: d.getFullYear(), m: d.getMonth() }); };
        return (
          <>
            <Card className="p-3">
              <div className="flex items-center justify-between mb-2">
                <button onClick={() => shift(-1)} className="p-2 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-navy"><Icon n="chevR" s={16} className="rotate-180"/></button>
                <div className="text-center">
                  <p className="font-black text-navy leading-tight">{new Date(y, m, 1).toLocaleDateString(undefined, { month:'long' })} {y}</p>
                  <button onClick={() => { const d = new Date(); setCursor({ y: d.getFullYear(), m: d.getMonth() }); setSelDay(today); }}
                    className="text-[10px] font-bold uppercase tracking-wider text-slateb hover:underline">Today</button>
                </div>
                <button onClick={() => shift(1)} className="p-2 rounded-lg text-slate-400 hover:bg-slate-100 hover:text-navy"><Icon n="chevR" s={16}/></button>
              </div>
              <div className="grid grid-cols-7 gap-0.5 mb-1">
                {DOW.map((d, i) => <div key={i} className="text-center text-[9px] font-black uppercase tracking-wide text-slate-400 py-1">{d[0]}</div>)}
              </div>
              <div className="grid grid-cols-7 gap-0.5">
                {cells.map((d, i) => {
                  if (!d) return <div key={i} />;
                  const iso = isoDay(y, m, d);
                  const evs = byDate[iso] || [];
                  const isToday = iso === today, isSel = iso === selDay;
                  return (
                    <button key={i} onClick={() => setSelDay(iso)}
                      className={cx('aspect-square rounded-lg flex flex-col items-center justify-center gap-0.5 transition relative',
                        isSel ? 'bg-navy text-white' : isToday ? 'bg-gold/15 text-navy' : 'text-navy hover:bg-slate-100')}>
                      <span className={cx('text-xs leading-none', (isToday || evs.length) ? 'font-black' : 'font-medium',
                        !isSel && !isToday && !evs.length && 'text-slate-400')}>{d}</span>
                      <span className="flex gap-0.5 h-1">
                        {evs.slice(0, 3).map(e => (
                          <span key={e.id} className={cx('w-1 h-1 rounded-full',
                            e.type === 'Game' ? (isSel ? 'bg-gold' : 'bg-gold') : (isSel ? 'bg-white' : 'bg-slateb'))} />
                        ))}
                      </span>
                    </button>
                  );
                })}
              </div>
              <div className="flex items-center justify-center gap-4 mt-2.5 pt-2.5 border-t border-slate-100">
                <span className="inline-flex items-center gap-1.5 text-[10px] font-bold text-slate-500"><span className="w-1.5 h-1.5 rounded-full bg-gold"/>Game</span>
                <span className="inline-flex items-center gap-1.5 text-[10px] font-bold text-slate-500"><span className="w-1.5 h-1.5 rounded-full bg-slateb"/>Practice</span>
              </div>
            </Card>

            <Card>
              <div className="px-4 pt-4 pb-1 flex items-center justify-between">
                <h2 className="text-[13px] font-extrabold uppercase tracking-[.12em] text-navy">{fmtDate(selDay)}</h2>
                {coach && <Btn size="sm" variant="ghost" icon="plus"
                  onClick={() => setEdit({ id: uid(), type:'Practice', date: selDay, time:'17:30', opponent:'', location:'Buist Gym', note:'' })}>Add</Btn>}
              </div>
              {!dayEvents.length
                ? <Empty icon="calendar" title="Nothing on this day" sub={coach ? 'Tap Add to put a practice or game here.' : 'Pick another day on the calendar.'} />
                : <div className="divide-y divide-slate-100">{dayEvents.map(e => <Row key={e.id} e={e} />)}</div>}
            </Card>
          </>
        );
      })()}

      {view === 'list' && <>
        <Card>
          <div className="px-4 pt-4"><SectionTitle icon="calendar">Upcoming</SectionTitle></div>
          {!upcoming.length ? <Empty icon="calendar" title="Nothing scheduled" sub={coach ? 'Add your next practice or game.' : 'Check back soon.'} />
            : <div className="divide-y divide-slate-100">{upcoming.map(e => <Row key={e.id} e={e} />)}</div>}
        </Card>

        {!!past.length && <Card>
          <div className="px-4 pt-4"><SectionTitle icon="clock">Past</SectionTitle></div>
          <div className="divide-y divide-slate-100 opacity-80">{past.map(e => <Row key={e.id} e={e} />)}</div>
        </Card>}
      </>}

      <Modal open={!!edit} onClose={() => setEdit(null)} title={db.events.some(e => e.id === edit?.id) ? 'Edit event' : 'Add event'}>
        {edit && <div className="space-y-3">
          <div className="grid grid-cols-2 gap-1.5">
            {['Practice','Game'].map(t => (
              <button key={t} onClick={() => setEdit({ ...edit, type: t })}
                className={cx('py-2.5 rounded-xl text-sm font-black transition', edit.type === t ? 'bg-navy text-white' : 'bg-slate-100 text-slate-500')}>{t}</button>
            ))}
          </div>
          <div className="grid grid-cols-2 gap-2">
            <Field label="Date"><input type="date" className={inputCls} value={edit.date} onChange={e => setEdit({ ...edit, date: e.target.value })} /></Field>
            <Field label="Time"><input type="time" className={inputCls} value={edit.time} onChange={e => setEdit({ ...edit, time: e.target.value })} /></Field>
          </div>
          {edit.type === 'Game' && <Field label="Opponent"><input className={inputCls} placeholder="Mason Prep Cardinals" value={edit.opponent} onChange={e => setEdit({ ...edit, opponent: e.target.value })} /></Field>}
          <Field label="Location">
            <input className={inputCls} placeholder="Buist Gym" value={edit.location} onChange={e => setEdit({ ...edit, location: e.target.value })} />
            <div className="flex gap-1.5 mt-1.5">
              {['Buist Gym','@ BLRC','Away'].map(l => <button key={l} onClick={() => setEdit({ ...edit, location: l })}
                className="px-2 py-1 rounded-lg bg-slate-100 text-[11px] font-bold text-slate-600 hover:bg-slate-200">{l}</button>)}
            </div>
          </Field>

let STAT_KEYS = [['pts','PTS'],['reb','REB'],['ast','AST'],['stl','STL']];
let DERIVED = { label: 'PPG', calc: (s) => (s.gp ? (s.pts / s.gp).toFixed(1) : '–') };
function Stats({ db, setDB, coach }) {
  const games = [...db.events].filter(e => e.type === 'Game').sort((a, b) => b.date.localeCompare(a.date));
  const [gid, setGid] = useState(games[0]?.id || '');
  const g = db.games[gid] || { us:'', them:'', stats:{} };
  const roster = [...db.roster].sort(byNum);

  const setG = (patch) => setDB(d => ({ ...d, games: { ...d.games, [gid]: { us:'', them:'', stats:{}, ...(d.games[gid] || {}), ...patch } } }));
  const setStat = (pid, k, v) => setDB(d => {
    const cur = d.games[gid] || { us:'', them:'', stats:{} };
    return { ...d, games: { ...d.games, [gid]: { ...cur, stats: { ...cur.stats, [pid]: { ...(cur.stats[pid] || {}), [k]: v === '' ? '' : Math.max(0, +v || 0) } } } } };
  });

  const season = useMemo(() => {
    const tot = {}; let w = 0, l = 0;
    roster.forEach(p => { tot[p.id] = { gp: 0 }; STAT_KEYS.forEach(([k]) => { tot[p.id][k] = 0; }); });
    games.forEach(ev => {
      const gg = db.games[ev.id]; if (!gg) return;
      if (gg.us !== '' && gg.them !== '') { if (+gg.us > +gg.them) w++; else if (+gg.us < +gg.them) l++; }
      Object.entries(gg.stats || {}).forEach(([pid, s]) => {
        if (!tot[pid]) return;
        const any = STAT_KEYS.some(([k]) => +s[k] > 0);
        if (any) tot[pid].gp++;
        STAT_KEYS.forEach(([k]) => tot[pid][k] += (+s[k] || 0));
      });
    });
    return { tot, w, l };
  }, [db.games, db.roster, db.events]);

  const ev = games.find(e => e.id === gid);
  const res = g.us !== '' && g.them !== '' ? (+g.us > +g.them ? 'W' : +g.us < +g.them ? 'L' : 'T') : null;

  return (

          </div>
          <div className="flex-1 rounded-2xl bg-slate-50 py-3 text-center">
            <p className="text-2xl font-black leading-none text-navy">{games.length}</p>
            <p className="text-[10px] font-bold uppercase tracking-widest text-slate-500 mt-1.5">Games</p>
          </div>
          <div className="flex-1 rounded-2xl bg-slate-50 py-3 text-center">
            <p className="text-2xl font-black leading-none text-navy">{db.roster.length}</p>
            <p className="text-[10px] font-bold uppercase tracking-widest text-slate-500 mt-1.5">Players</p>
          </div>
        </div>
      </Card>

      {!games.length ? <Card className="p-4"><Empty icon="chart" title="No games scheduled" sub="Add a game on the Schedule tab to start tracking stats." /></Card> : (
        <>
          <Card className="p-4">
            <SectionTitle icon="chart">Box score</SectionTitle>
            <select value={gid} onChange={e => setGid(e.target.value)} className={cx(inputCls, 'font-semibold')}>
              {games.map(e => <option key={e.id} value={e.id}>{fmtDate(e.date)} · {e.opponent || 'Game'}</option>)}
            </select>
            <div className="mt-3 flex items-center justify-center gap-3">
              <div className="text-center flex-1">
                <p className="text-[10px] font-black uppercase tracking-wider text-slate-500 mb-1">Knights</p>
                {coach ? <input inputMode="numeric" className={cx(inputCls, 'text-center text-2xl font-black py-1')} value={g.us} onChange={e => setG({ us: e.target.value })} />
                  : <p className="text-3xl font-black text-navy">{g.us || '–'}</p>}
              </div>
              <div className="pt-4">
                {res ? <Pill tone={res === 'W' ? 'green' : res === 'L' ? 'red' : 'amber'}>{res}</Pill> : <span className="text-slate-300 font-black">vs</span>}
              </div>
              <div className="text-center flex-1">
                <p className="text-[10px] font-black uppercase tracking-wider text-slate-500 mb-1 truncate">{ev?.opponent || 'Opponent'}</p>
                {coach ? <input inputMode="numeric" className={cx(inputCls, 'text-center text-2xl font-black py-1')} value={g.them} onChange={e => setG({ them: e.target.value })} />
                  : <p className="text-3xl font-black text-navy">{g.them || '–'}</p>}
              </div>
            </div>
          </Card>

          <Card className="p-2">
            <div className="overflow-x-auto no-scrollbar">

                <thead>
                  <tr className="text-[10px] font-black uppercase tracking-wider text-slate-400">

                <tbody className="divide-y divide-slate-100">
                  {roster.map(p => {
                    const s = g.stats?.[p.id] || {};
                    return <tr key={p.id}>
                      <td className="py-1.5 px-2">

const fmtWhen = (ts) => {
  if (!ts) return '';
  const d = new Date(ts), now2 = new Date();
  const sameDay = d.toDateString() === now2.toDateString();
  if (sameDay) return d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  const days = Math.round((now2 - d) / 86400000);
  if (days < 7) return d.toLocaleDateString(undefined, { weekday: 'short' }) + ' ' +
                       d.toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
};

function Messages({ team, me, onRead }) {
  const [threads, setThreads] = useState(null);
  const [openKey, setOpenKey] = useState(null);
  const [msgs, setMsgs] = useState(null);
  const [canPost, setCanPost] = useState(false);
  const [draft, setDraft] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  const bottom = useRef(null);

  const loadThreads = useCallback(async () => {
    try { const r = await api(`/teams/${team.id}/threads`); setThreads(r.threads); onRead && onRead(); }
    catch (e) { setErr(e.message); }
  }, [team.id, onRead]);

  useEffect(() => { loadThreads(); }, [loadThreads]);

  const openThread = async (key) => {
    setOpenKey(key); setMsgs(null); setErr(''); setDraft('');
    try {
      const r = await api(`/teams/${team.id}/threads/${key}/messages`);
      setMsgs(r.messages); setCanPost(r.canPost);
      await api(`/teams/${team.id}/threads/${key}/read`, { method: 'POST' });
      onRead && onRead();
    } catch (e) { setErr(e.message); }
  };

  useEffect(() => { if (bottom.current) bottom.current.scrollIntoView({ block: 'end' }); }, [msgs]);

  const send = async () => {
    const body = draft.trim();
    if (!body || busy) return;
    setBusy(true); setErr('');
    try {
      await api(`/teams/${team.id}/threads/${openKey}/messages`, { method: 'POST', body: { body } });
      setDraft('');
      const r = await api(`/teams/${team.id}/threads/${openKey}/messages`);
      setMsgs(r.messages); setCanPost(r.canPost);
    } catch (e) { setErr(e.message); }
    setBusy(false);
  };

  /* ---- one conversation ---- */
  if (openKey) {
    const t = (threads || []).find(x => x.key === openKey);
    return (
      <div className="space-y-3">
        <button onClick={() => { setOpenKey(null); loadThreads(); }}

        <Card className="p-4">
          <SectionTitle icon={t && t.kind === 'team' ? 'users' : 'chat'}>{t ? t.title : 'Conversation'}</SectionTitle>
          {t && t.kind === 'player' && (
            <p className="text-[11px] text-slate-500 -mt-1 mb-2">Every coach on this team can see this conversation.</p>
          )}
          {t && t.kind === 'team' && (
            <p className="text-[11px] text-slate-500 -mt-1 mb-2">Everyone on the team sees these. Only coaches can post.</p>
          )}

          {!msgs ? <p className="text-xs text-slate-400 py-4 text-center">Loading…</p> : (
            <div className="space-y-2 max-h-[52vh] overflow-y-auto no-scrollbar py-1">
              {!msgs.length && <Empty icon="chat" title="Nothing here yet" sub={canPost ? 'Send the first message.' : 'Your coach has not posted yet.'} />}
              {msgs.map(m => {
                const mine = m.sender_id === me.id;
                return (
                  <div key={m.id} className={cx('flex', mine ? 'justify-end' : 'justify-start')}>
                    <div className={cx('max-w-[80%] rounded-2xl px-3 py-2',
                      mine ? 'bg-navy text-white' : 'bg-slate-100 text-navy')}>
                      {!mine && (
                        <p className="text-[10px] font-black uppercase tracking-wider mb-0.5 text-slateb">
                          {m.sender_name}{m.sender_role === 'coach' ? ' · coach' : ''}
                        </p>
                      )}
                      <p className="text-sm whitespace-pre-wrap break-words">{m.body}</p>
                      <p className={cx('text-[10px] mt-1', mine ? 'text-slate-300' : 'text-slate-400')}>{fmtWhen(m.created_at)}</p>
                    </div>
                  </div>
                );
              })}
              <div ref={bottom} />
            </div>
          )}

          <ErrorNote>{err}</ErrorNote>

          {canPost ? (
            <div className="flex gap-2 mt-3 pt-3 border-t border-slate-100">
              <textarea rows="2" className={cx(inputCls, 'flex-1 resize-none')} value={draft}
                placeholder="Write a message…" maxLength="2000"
                onChange={e => setDraft(e.target.value)}
                onKeyDown={e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) send(); }} />
              <Btn variant="primary" icon="send" disabled={busy || !draft.trim()} onClick={send}>Send</Btn>
            </div>
          ) : (
            <p className="text-[11px] text-slate-500 mt-3 pt-3 border-t border-slate-100">
              {(t && t.kind === 'team') ? 'Only coaches can post announcements.' : 'You can reply once a coach starts the conversation.'}
            </p>
          )}
        </Card>
      </div>
    );
  }

  /* ---- list of conversations ---- */
  return (
    <div className="space-y-4">
      <Card className="p-4">
        <SectionTitle icon="chat" right={<button onClick={loadThreads} className="text-[11px] font-bold text-slateb hover:underline">Refresh</button>}>
          Messages
        </SectionTitle>
        <ErrorNote>{err}</ErrorNote>
        {!threads ? <p className="text-xs text-slate-400 py-4 text-center">Loading…</p> : (
          <div className="divide-y divide-slate-100 -mx-1">
            {threads.map(t => (
              <button key={t.key} onClick={() => openThread(t.key)} className="w-full flex items-center gap-3 py-2.5 px-1 text-left hover:bg-slate-50 rounded-lg">
                <span className={cx('shrink-0 w-9 h-9 rounded-xl grid place-items-center',
                  t.kind === 'team' ? 'bg-navy text-gold' : t.kind === 'coach' ? 'bg-gold text-navy' : 'bg-slate-100 text-navy')}>
                  <Icon n={t.kind === 'team' ? 'users' : 'chat'} s={16}/>
                </span>
                <span className="min-w-0 flex-1">
                  <span className="flex items-center gap-1.5">
                    <span className="text-sm font-bold text-navy truncate">{t.title}</span>
                    {t.kind === 'coach' && <Pill tone="gold">coach</Pill>}
                  </span>
                  <span className="block text-[11px] text-slate-500 truncate">
                    {t.preview ? `${t.preview.name}: ${t.preview.body}` : 'No messages yet'}
                  </span>
                </span>
                {t.lastAt > 0 && <span className="shrink-0 text-[10px] text-slate-400">{fmtWhen(t.lastAt)}</span>}
                {t.unread > 0 && (
                  <span className="shrink-0 min-w-[20px] h-5 px-1.5 rounded-full bg-gold text-navy text-[10px] font-black grid place-items-center">{t.unread}</span>
                )}
              </button>
            ))}
          </div>
        )}
      </Card>
    </div>
  );
}

/* Shrink whatever the admin picked to a 256px PNG before it ever reaches
   the database — a phone photo would otherwise be several megabytes. */
function readLogoFile(file) {
  return new Promise((resolve, reject) => {
    if (!file.type.startsWith('image/')) return reject(new Error('Pick an image file.'));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('That file could not be read.'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('That image could not be read.'));
      img.onload = () => {
        const max = 256;
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const w = Math.max(1, Math.round(img.width * scale));
        const h = Math.max(1, Math.round(img.height * scale));
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/png'));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
