    <Shell>
      <div className="flex items-center justify-between mb-3">
        <div className="min-w-0">
          <p className="font-black text-navy truncate">Hi {user.name.split(' ')[0]}</p>
          <p className="text-[11px] text-slate-500 truncate">{user.username}</p>
        </div>
        <button onClick={onSignOut} className="shrink-0 text-[11px] font-bold text-slate-500 hover:text-navy">Sign out</button>
      </div>
      {isAdmin ? (
        <>
          <p className="text-sm text-slate-600 mb-3">No teams yet. Create one in the admin portal, then add coaches and players to it.</p>
          <Btn variant="gold" size="lg" className="w-full" icon="sliders" onClick={onAdmin}>Open admin portal</Btn>
        </>
      ) : (
        <p className="text-sm text-slate-600">
          You are not on a team yet. Your admin needs to add you to one — once they do, it will show up here.
        </p>
      )}
    </Shell>
  );
}

/* ------------------------------------------------------------ admin portal */

function AdminPortal({ open, onClose, me, onChanged }) {
  const [data, setData] = useState(null);
  const [err, setErr] = useState('');
  const [view, setView] = useState('people');
  const [teamForm, setTeamForm] = useState(null);
  const [userForm, setUserForm] = useState(null);
  const [progForm, setProgForm] = useState(null);
  const [made, setMade] = useState(null);

  const load = useCallback(async () => {
    try { setData(await api('/admin/overview')); setErr(''); } catch (e) { setErr(e.message); }
  }, []);
  useEffect(() => { if (open) { load(); setMade(null); setErr(''); } }, [open, load]);
  const run = async (fn) => { setErr(''); try { await fn(); await load(); await onChanged(); } catch (e) { setErr(e.message); } };

  const teams = (data && data.teams) || [];
  const users = (data && data.users) || [];
  const programs = (data && data.programs) || [];

  return (
    <Modal open={open} onClose={onClose} title="Admin portal" wide>
      <div className="grid grid-cols-3 gap-1 p-1 bg-slate-100 rounded-xl mb-4">
        {[['people', `People${users.length ? ' · ' + users.length : ''}`],
          ['teams', `Teams${teams.length ? ' · ' + teams.length : ''}`],
          ['programs', `Programs${programs.length ? ' · ' + programs.length : ''}`]].map(([k, l]) => (
          <button key={k} onClick={() => setView(k)}
            className={cx('py-2 rounded-lg text-xs font-extrabold transition',
              view === k ? 'bg-white text-navy shadow-sm' : 'text-slate-500')}>{l}</button>
        ))}
      </div>

      <ErrorNote>{err}</ErrorNote>

      {made && (
        <div className="rounded-xl border border-gold/40 bg-gold/10 p-3 my-3">
          <p className="text-[11px] font-black uppercase tracking-wider text-gold-600">Hand these to {made.name}</p>
          <p className="text-sm font-black text-navy mt-1">Username <span className="select-all">{made.username}</span></p>
          <p className="text-sm font-black text-navy">Password <span className="select-all">{made.password}</span></p>
          <p className="text-[11px] text-slate-600 mt-1">{"Write it down now — the password is not stored anywhere you can read it back."}</p>
        </div>
      )}

      {view === 'programs' && (
        <div className="space-y-3 mt-3">
          {!programs.length && <Empty icon="shield" title="No programs yet" sub="A program is all the teams in one sport — Buist Basketball, Buist Lacrosse." />}
          {programs.map(pr => (
            <div key={pr.id} className="flex items-center gap-3 rounded-xl border border-slate-200 px-3 py-2.5">
              <Logo size="w-10 h-10" src={pr.logo} />
              <span className="min-w-0 flex-1">
                <span className="block text-sm font-bold text-navy truncate">{pr.name}</span>
                <span className="block text-[11px] text-slate-500">
                  {(SPORTS[pr.sport] || SPORTS.basketball).label} · {pr.teams} team{pr.teams === 1 ? '' : 's'}
                  {!pr.logo && ' · no logo yet'}
                </span>
              </span>
              <button onClick={() => setProgForm({ ...pr })} className="shrink-0 p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><Icon n="pencil" s={14}/></button>
              <button onClick={() => run(async () => {
                  if (!confirm(`Delete ${pr.name}?`)) return;
                  await api(`/admin/programs/${pr.id}`, { method: 'DELETE' });
                })}
                className="shrink-0 p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon n="trash" s={14}/></button>
            </div>
          ))}
          <Btn variant="gold" icon="plus" className="w-full"
            onClick={() => setProgForm({ isNew: true, name: '', sport: 'basketball', logo: null })}>Add a program</Btn>
        </div>
      )}

      {view === 'teams' && (
        <div className="space-y-3 mt-3">
          {!teams.length && <Empty icon="users" title="No teams yet" sub="Create one, then add people to it." />}
          {teams.map(t => (
            <div key={t.id} className="flex items-center gap-2 rounded-xl border border-slate-200 px-3 py-2.5">
              <span className="min-w-0 flex-1">
                <span className="block text-sm font-bold text-navy truncate">{t.name}</span>
                <span className="block text-[11px] text-slate-500">{t.programName || 'No program'} · {t.grade} · {t.members} on the team · {t.coaches} coach{t.coaches === 1 ? '' : 'es'}</span>
              </span>
              <button onClick={() => setTeamForm({ ...t })} className="shrink-0 p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><Icon n="pencil" s={14}/></button>
              <button onClick={() => run(async () => {
                  if (!confirm(`Delete ${t.name}? Its roster, schedule, stats and plays go with it.`)) return;
                  await api(`/admin/teams/${t.id}`, { method: 'DELETE' });
                })}
                className="shrink-0 p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon n="trash" s={14}/></button>
            </div>
          ))}
          <Btn variant="gold" icon="plus" className="w-full"
            onClick={() => setTeamForm({ name: '', grade: '6th', programId: programs[0] ? programs[0].id : '', isNew: true })}>Add a team</Btn>
        </div>
      )}

      {view === 'people' && (
        <div className="space-y-3 mt-3">
          {users.map(u => (
            <div key={u.id} className="rounded-xl border border-slate-200 px-3 py-2.5">
              <div className="flex items-center gap-2">
                <span className={cx('shrink-0 w-8 h-8 rounded-lg grid place-items-center text-[11px] font-black',
                  u.isAdmin ? 'bg-navy text-gold' : 'bg-slate-100 text-navy')}>{u.name.slice(0,1).toUpperCase()}</span>
                <span className="min-w-0 flex-1">
                  <span className="block text-sm font-bold text-navy truncate">
                    {u.name}{u.id === me.id && <span className="text-slate-400 font-medium"> · you</span>}
                  </span>
                  <span className="block text-[11px] text-slate-500 truncate">{u.username}</span>
                </span>
                {u.isAdmin && <Pill tone="navy">admin</Pill>}
                <button onClick={() => setUserForm({ ...u, password: '', teamId: '', role: 'member' })}
                  className="shrink-0 p-1.5 rounded-lg text-slate-400 hover:bg-slate-100"><Icon n="pencil" s={14}/></button>
                {u.id !== me.id && (
                  <button onClick={() => run(async () => {
                      if (!confirm(`Delete ${u.name}? They lose access immediately.`)) return;
                      await api(`/admin/users/${u.id}`, { method: 'DELETE' });
                    })}
                    className="shrink-0 p-1.5 rounded-lg text-slate-300 hover:bg-red-50 hover:text-red-500"><Icon n="trash" s={14}/></button>
                )}
              </div>
              {!!u.teams.length && (
                <div className="flex flex-wrap gap-1 mt-1.5 pl-10">
                  {u.teams.map(t => (
                    <span key={t.id} className={cx('inline-flex items-center gap-1 px-1.5 py-0.5 rounded text-[10px] font-black',
                      t.role === 'coach' ? 'bg-gold/25 text-gold-600' : 'bg-slate-100 text-slate-600')}>
                      {t.name} · {t.role}
                      <button onClick={() => run(() => api(`/admin/users/${u.id}/membership/${t.id}`, { method: 'DELETE' }))}
                        className="hover:text-red-500"><Icon n="x" s={10}/></button>
                    </span>
                  ))}
                </div>
              )}
            </div>
          ))}
          <Btn variant="gold" icon="plus" className="w-full"
            onClick={() => setUserForm({ isNew: true, name: '', username: '', password: suggestPassword(),
                                         isAdmin: false, teamId: teams[0] ? teams[0].id : '', role: 'member', teams: [] })}>
            Add a person
          </Btn>
          {!teams.length && <p className="text-[11px] text-slate-500">Create a team first if you want to assign someone to one.</p>}
        </div>
      )}

      <div className="pt-4 mt-4 border-t border-slate-100">
        <Btn variant="primary" icon="check" className="w-full" onClick={onClose}>Done — back to the app</Btn>
      </div>

      {/* program add / edit */}
      <Modal open={!!progForm} onClose={() => setProgForm(null)} title={progForm && progForm.isNew ? 'Add a program' : 'Edit program'}>
        {progForm && <div className="space-y-3">
          <Field label="Program name">
            <input className={inputCls} value={progForm.name}
              onChange={e => setProgForm({ ...progForm, name: e.target.value })} placeholder="Buist Basketball" />
          </Field>
          <Field label="Sport">
            <div className="grid grid-cols-2 gap-1.5">
              {Object.values(SPORTS).map(sp => (
                <button key={sp.key} onClick={() => setProgForm({ ...progForm, sport: sp.key })}
                  disabled={!progForm.isNew}
                  className={cx('py-2 rounded-xl text-xs font-black transition disabled:opacity-50',
                    (progForm.sport || 'basketball') === sp.key ? 'bg-navy text-white' : 'bg-slate-100 text-slate-500')}>
                  {sp.label}
                </button>
              ))}
            </div>
            {!progForm.isNew && <p className="text-[11px] text-slate-500 mt-1">The sport is fixed once teams exist under it.</p>}
          </Field>
          <Field label="Logo">
            <div className="flex items-center gap-3">
              <Logo size="w-14 h-14" src={progForm.logo} />
              <div className="flex-1 space-y-1.5">
                <input type="file" accept="image/*" className="block w-full text-[11px] text-slate-500
                  file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold
                  file:bg-slate-100 file:text-navy hover:file:bg-slate-200"
                  onChange={async (e) => {
                    const f = e.target.files && e.target.files[0];
                    if (!f) return;
                    try { setProgForm({ ...progForm, logo: await readLogoFile(f) }); setErr(''); }
                    catch (e2) { setErr(e2.message); }
                  }} />
                {progForm.logo && (
                  <button onClick={() => setProgForm({ ...progForm, logo: null })}
                    className="text-[11px] font-bold text-slate-500 hover:text-red-500">Remove logo</button>
                )}
              </div>
            </div>
            <p className="text-[11px] text-slate-500 mt-1.5">Shrunk to 256px automatically. Square images look best. Without one, the Buist crest is used.</p>
          </Field>
          <div className="flex gap-2 pt-1">
            <Btn variant="ghost" className="flex-1" onClick={() => setProgForm(null)}>Cancel</Btn>
            <Btn variant="primary" icon="save" className="flex-1" onClick={() => run(async () => {
              const payload = { name: progForm.name.trim(), logo: progForm.logo || null };
              if (progForm.isNew) await api('/admin/programs', { method: 'POST', body: { ...payload, sport: progForm.sport } });
              else await api(`/admin/programs/${progForm.id}`, { method: 'PATCH', body: payload });
              setProgForm(null);
            })}>{progForm.isNew ? 'Create program' : 'Save program'}</Btn>
          </div>
        </div>}
      </Modal>

      {/* team add / edit */}
      <Modal open={!!teamForm} onClose={() => setTeamForm(null)} title={teamForm && teamForm.isNew ? 'Add a team' : 'Edit team'}>
        {teamForm && <div className="space-y-3">
          <Field label="Program">
            <select className={inputCls} value={teamForm.programId || ''}
              onChange={e => setTeamForm({ ...teamForm, programId: e.target.value })}>
              <option value="">Choose a program…</option>
              {programs.map(pr => <option key={pr.id} value={pr.id}>{pr.name} ({(SPORTS[pr.sport] || SPORTS.basketball).label})</option>)}
            </select>
            <p className="text-[11px] text-slate-500 mt-1">
              {programs.length ? 'The program decides the sport and the logo.' : 'Create a program first — teams live inside one.'}
            </p>
          </Field>
          <Field label="Grade">
            <div className="grid grid-cols-5 gap-1.5">
              {GRADES.map(g => (
                <button key={g} onClick={() => setTeamForm({ ...teamForm, grade: g,
                    name: (!teamForm.name || GRADES.some(x => teamForm.name === `${x} Grade`)) ? `${g} Grade` : teamForm.name })}
                  className={cx('py-2 rounded-xl text-xs font-black transition',
                    teamForm.grade === g ? 'bg-navy text-white' : 'bg-slate-100 text-slate-500')}>{g}</button>
              ))}
            </div>
          </Field>
          <Field label="Team name">
            <input className={inputCls} value={teamForm.name} onChange={e => setTeamForm({ ...teamForm, name: e.target.value })}
              placeholder={`${teamForm.grade} Grade`} />
          </Field>
          <Btn variant="primary" icon="save" className="w-full" onClick={() => run(async () => {
            const payload = { name: teamForm.name.trim() || `${teamForm.grade} Grade`, grade: teamForm.grade,
                              programId: teamForm.programId || undefined };
            // send an empty doc: the starter plays get seeded on first open,
            // once the app has switched to this team's sport
            if (teamForm.isNew) await api('/admin/teams', { method: 'POST', body: { ...payload, doc: {} } });
            else await api(`/admin/teams/${teamForm.id}`, { method: 'PATCH', body: payload });
            setTeamForm(null);
          })}>{teamForm.isNew ? 'Create team' : 'Save team'}</Btn>
        </div>}
      </Modal>

      {/* person add / edit */}
      <Modal open={!!userForm} onClose={() => setUserForm(null)} title={userForm && userForm.isNew ? 'Add a person' : 'Edit person'} wide>
        {userForm && <div className="space-y-3">
          <Field label="Name">
            <input className={inputCls} value={userForm.name}
              onChange={e => {
                const name = e.target.value;
                const auto = userForm.isNew && (!userForm.touchedUser);
                setUserForm({ ...userForm, name,
                  username: auto ? name.toLowerCase().replace(/[^a-z0-9]+/g, '').slice(0, 20) : userForm.username });
              }} placeholder="Marcus Bell" />
          </Field>
          <Field label="Username">
            <input className={inputCls} value={userForm.username} autoCapitalize="none"
              disabled={!userForm.isNew}
              onChange={e => setUserForm({ ...userForm, username: e.target.value.toLowerCase(), touchedUser: true })} />
            {!userForm.isNew && <p className="text-[11px] text-slate-500 mt-1">Usernames cannot be changed.</p>}
          </Field>
          <Field label={userForm.isNew ? 'Password' : 'New password (leave blank to keep)'}>
            <div className="flex gap-2">
              <input className={inputCls} value={userForm.password}
                onChange={e => setUserForm({ ...userForm, password: e.target.value })} placeholder="At least 8 characters" />
              <Btn variant="ghost" onClick={() => setUserForm({ ...userForm, password: suggestPassword() })}>New one</Btn>
            </div>
          </Field>
          {teams.length > 0 && (
            <Field label={userForm.isNew ? 'Put them on a team' : 'Add to a team'}>
              <div className="flex gap-2">
                <select className={cx(inputCls, 'flex-1')} value={userForm.teamId}
                  onChange={e => setUserForm({ ...userForm, teamId: e.target.value })}>
                  <option value="">No team</option>
                  {teams.map(t => <option key={t.id} value={t.id}>{t.name}</option>)}
                </select>
                <select className={inputCls} style={{ width: 110 }} value={userForm.role}
                  onChange={e => setUserForm({ ...userForm, role: e.target.value })}>
                  <option value="member">Player</option>
                  <option value="coach">Coach</option>
                </select>
              </div>
            </Field>
          )}
          <label className="flex items-center gap-2 text-xs font-bold text-navy">
            <input type="checkbox" checked={!!userForm.isAdmin} className="w-4 h-4"
              onChange={e => setUserForm({ ...userForm, isAdmin: e.target.checked })} />
            Make them an admin too
          </label>
          <div className="flex gap-2 pt-1">
            <Btn variant="ghost" className="flex-1" onClick={() => setUserForm(null)}>Cancel</Btn>
            <Btn variant="primary" icon="save" className="flex-1" onClick={() => run(async () => {
              if (userForm.isNew) {
                await api('/admin/users', { method: 'POST', body: {
                  name: userForm.name, username: userForm.username, password: userForm.password,
                  isAdmin: !!userForm.isAdmin, teamId: userForm.teamId || undefined, role: userForm.role } });
                setMade({ name: userForm.name, username: userForm.username, password: userForm.password });
              } else {
                const body = { name: userForm.name, isAdmin: !!userForm.isAdmin };
                if (userForm.password) body.password = userForm.password;
                await api(`/admin/users/${userForm.id}`, { method: 'PATCH', body });
                if (userForm.teamId) await api(`/admin/users/${userForm.id}/membership`, { method: 'POST',
                  body: { teamId: userForm.teamId, role: userForm.role } });
                if (userForm.password) setMade({ name: userForm.name, username: userForm.username, password: userForm.password });
              }
              setUserForm(null);
            })}>{userForm.isNew ? 'Create account' : 'Save'}</Btn>
          </div>
        </div>}
      </Modal>
    </Modal>
  );
}

/* -------------------------------------------------------- team + account */

function TeamSettings({ open, onClose, team, me }) {
  const [members, setMembers] = useState(null);
  const [err, setErr] = useState('');
  useEffect(() => {
    if (!open) return;
    setErr(''); setMembers(null);
    api(`/teams/${team.id}/members`).then(r => setMembers(r.members)).catch(e => setErr(e.message));
  }, [open, team.id]);
  return (
    <Modal open={open} onClose={onClose} title={team.name}>
      <div className="space-y-3">
        <p className="text-[11px] text-slate-500">
          {(SPORTS[team.sport] || SPORTS.basketball).label} · {team.grade} · you are {team.role === 'coach' ? 'a coach' : team.role === 'admin' ? 'an admin' : 'a player'} on this team.
        </p>
        <ErrorNote>{err}</ErrorNote>
        <div>
          <p className="text-[10px] font-black uppercase tracking-wider text-slate-500 mb-1.5">
            On this team {members ? `(${members.length})` : ''}
          </p>
          {!members ? <p className="text-xs text-slate-400 py-2">Loading…</p> : (
            <div className="divide-y divide-slate-100">
              {members.map(mem => (
                <div key={mem.id} className="flex items-center gap-2 py-2">
                  <span className={cx('shrink-0 w-8 h-8 rounded-lg grid place-items-center text-[11px] font-black',
                    mem.role === 'coach' ? 'bg-gold text-navy' : 'bg-slate-100 text-navy')}>
                    {mem.name.slice(0,1).toUpperCase()}
                  </span>
                  <span className="min-w-0 flex-1">
                    <span className="block text-sm font-bold text-navy truncate">
                      {mem.name}{mem.id === me.id && <span className="text-slate-400 font-medium"> · you</span>}
                    </span>
                    <span className="block text-[11px] text-slate-500 truncate">{mem.username}</span>
                  </span>
                  <Pill tone={mem.role === 'coach' ? 'gold' : 'slate'}>{mem.role === 'coach' ? 'coach' : 'player'}</Pill>
                </div>
              ))}
            </div>
          )}
        </div>
        <p className="text-[11px] text-slate-500 pt-2 border-t border-slate-100">
          Accounts and team assignments are managed by the admin.
        </p>
      </div>
    </Modal>
  );
}

function AccountModal({ open, onClose, user, onSignOut }) {
  const [cur, setCur] = useState(''); const [next, setNext] = useState('');
  const [msg, setMsg] = useState(''); const [err, setErr] = useState('');
  useEffect(() => { if (open) { setCur(''); setNext(''); setMsg(''); setErr(''); } }, [open]);
  return (
    <Modal open={open} onClose={onClose} title="Your account">
      <div className="space-y-4">
        <div className="rounded-xl bg-slate-50 p-3">
          <p className="font-bold text-navy text-sm">{user.name}</p>
          <p className="text-[11px] text-slate-500">{user.username}{user.isAdmin ? ' · admin' : ''}</p>
        </div>
        <div className="space-y-2">
          <Field label="Current password"><input className={inputCls} type="password" value={cur} onChange={e => setCur(e.target.value)} /></Field>
          <Field label="New password"><input className={inputCls} type="password" value={next} onChange={e => setNext(e.target.value)} placeholder="At least 8 characters" /></Field>
          {msg && <p className="text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 rounded-xl px-3 py-2">{msg}</p>}
          <ErrorNote>{err}</ErrorNote>
          <Btn variant="primary" icon="save" className="w-full" disabled={next.length < 8}
            onClick={async () => {
              setErr(''); setMsg('');
              try { await api('/password', { method: 'POST', body: { currentPassword: cur, password: next } });
                    setMsg('Password changed. Other devices were signed out.'); setCur(''); setNext(''); }
              catch (e) { setErr(e.message); }
            }}>Change password</Btn>
        </div>
        <div className="pt-3 border-t border-slate-100">
          <Btn variant="ghost" icon="logout" className="w-full" onClick={onSignOut}>Sign out</Btn>
        </div>
      </div>
    </Modal>
  );
}

/* ---------------------------------------------------------------- the app */

function App() {
  const [boot, setBoot] = useState(true);
  const [needsSetup, setNeedsSetup] = useState(false);
  const [user, setUser] = useState(null);
  const [teams, setTeams] = useState([]);
  const [activeId, setActiveId] = useState(() => { try { return localStorage.getItem(LAST_TEAM_KEY) || null; } catch (e) { return null; } });
  const [doc, setDoc] = useState(null);
  const [canWrite, setCanWrite] = useState(false);
  const [docErr, setDocErr] = useState('');
  const [tab, setTab] = useState('playbook');
  const [teamPicker, setTeamPicker] = useState(false);
  const [settings, setSettings] = useState(false);
  const [account, setAccount] = useState(false);
  const [admin, setAdmin] = useState(false);
  const [saveState, setSaveState] = useState('idle');
  const [unread, setUnread] = useState(0);
  const [teamMeta, setTeamMeta] = useState(null);   // program name and logo for the header

  const docRef = useRef(null), revRef = useRef(0), dirtyRef = useRef(false), timerRef = useRef(0);

  const refresh = useCallback(async () => {
    const r = await api('/me');
    setUser(r.user); setTeams(r.teams || []);
    return r;
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const st = await api('/status');
        setNeedsSetup(!!st.needsSetup);
        if (!st.needsSetup) await refresh();
      } catch (e) {} finally { setBoot(false); }
    })();
  }, [refresh]);

  const team = teams.find(t => t.id === activeId) || teams[0] || null;
  const isCoach = canWrite;

  useEffect(() => {
    if (!team) { setDoc(null); return; }
    let cancelled = false;
    setDoc(null); setDocErr('');
    api(`/teams/${team.id}`).then(r => {
      if (cancelled) return;
      applySport((r.team && r.team.sport) || team.sport);   // before normalising
      setTeamMeta(r.team || null);
      const d = normalizeDoc(r.doc);
      docRef.current = d; revRef.current = r.rev; dirtyRef.current = false;
      setCanWrite(!!r.canWrite);
      setDoc(d);
    }).catch(e => { if (!cancelled) setDocErr(e.message); });
    return () => { cancelled = true; };
  }, [team && team.id]);

  const refreshUnread = useCallback(async () => {
    const t = teams.find(x => x.id === activeId) || teams[0];
    if (!t) { setUnread(0); return; }
    try {
      const r = await api(`/teams/${t.id}/threads`);
      setUnread((r.threads || []).reduce((n, x) => n + (x.unread || 0), 0));
    } catch (e) { /* messaging is not critical enough to surface here */ }
  }, [teams, activeId]);
  useEffect(() => { refreshUnread(); }, [refreshUnread]);

  useEffect(() => { try { activeId ? localStorage.setItem(LAST_TEAM_KEY, activeId) : localStorage.removeItem(LAST_TEAM_KEY); } catch (e) {} }, [activeId]);
  useEffect(() => { if (!isCoach && TABS.find(t => t.k === tab)?.coachOnly) setTab('playbook'); }, [isCoach, tab]);

  const flush = useCallback(async () => {
    if (!dirtyRef.current || !docRef.current || !team) return;
    dirtyRef.current = false;
    setSaveState('saving');
    try {
      const r = await api(`/teams/${team.id}`, { method: 'PUT', body: { doc: docRef.current, rev: revRef.current } });
      revRef.current = r.rev;
      setSaveState('saved');
      setTimeout(() => setSaveState(s => (s === 'saved' ? 'idle' : s)), 1600);
    } catch (e) { setSaveState(e.status === 409 ? 'conflict' : 'error'); }
  }, [team && team.id]);

  const setDB = useCallback((updater) => {
    setDoc(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      docRef.current = next;
      return next;
    });
    dirtyRef.current = true;
    clearTimeout(timerRef.current);
    timerRef.current = setTimeout(() => { flush(); }, 900);
  }, [flush]);

  useEffect(() => {
    const go = () => { if (dirtyRef.current) { clearTimeout(timerRef.current); flush(); } };
    window.addEventListener('pagehide', go);
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') go(); });
    return () => window.removeEventListener('pagehide', go);
  }, [flush]);

  const signOut = async () => {
    try { await api('/logout', { method: 'POST' }); } catch (e) {}
    setUser(null); setTeams([]); setActiveId(null); setDoc(null);
    setAccount(false); setSettings(false); setTeamPicker(false); setAdmin(false);
  };

  if (boot) return <Shell><p className="text-sm text-slate-500 text-center py-6">Loading…</p></Shell>;
  if (needsSetup) return <SetupScreen onAuthed={(d) => { setNeedsSetup(false); setUser(d.user); setTeams(d.teams || []); }} />;
  if (!user) return <AuthScreen onAuthed={(d) => { setUser(d.user); setTeams(d.teams || []); }} />;
  if (user.mustChange) return <ForcedPasswordScreen user={user} onSignOut={signOut}
    onDone={() => { setUser({ ...user, mustChange: false }); refresh(); }} />;
  if (!team) return (
    <>
      <NoTeams user={user} isAdmin={user.isAdmin} onSignOut={signOut} onAdmin={() => setAdmin(true)} />
      <AdminPortal open={admin} onClose={() => setAdmin(false)} me={user} onChanged={refresh} />
    </>
  );

  const tabs = TABS.filter(t => isCoach || !t.coachOnly);
  const saveLabel = { saving: 'Saving…', saved: 'Saved', error: 'Not saved — retrying on next change', conflict: 'Changed elsewhere — reload' }[saveState];

  return (
    <div className="min-h-full pb-24">
      <header className="sticky top-0 z-40 bg-navy text-white shadow-lg">
        <div className="max-w-3xl mx-auto px-3 sm:px-4 py-2.5 flex items-center gap-2.5">
          <Logo size="w-9 h-9" src={teamMeta && teamMeta.programLogo} />
          <button onClick={() => setTeamPicker(true)} className="min-w-0 flex-1 text-left group" title="Switch team">
            <span className="block font-black leading-tight tracking-tight text-[14px] sm:text-base truncate">{team.name}</span>
            <span className="flex items-center gap-1 text-[10px] sm:text-[11px] font-bold uppercase tracking-[.16em] text-gold">
              <span className="truncate">{team.role === 'coach' ? 'Coach' : team.role === 'admin' ? 'Admin' : 'Player'}</span>
              {teams.length > 1 && <Icon n="chevD" s={12} className="opacity-70 shrink-0"/>}
            </span>
          </button>
          {user.isAdmin && (
            <button onClick={() => setAdmin(true)} title="Admin portal"
              className="shrink-0 px-2 py-1.5 rounded-xl bg-white/10 text-gold text-[10px] font-black uppercase tracking-wider hover:bg-white/20">Admin</button>
          )}
          <button onClick={() => setSettings(true)} title="Team info"
            className="shrink-0 p-2 rounded-xl text-slate-300 hover:bg-white/10"><Icon n="users" s={17}/></button>
          <button onClick={() => setAccount(true)} title="Your account"
            className="shrink-0 w-8 h-8 rounded-full bg-gold text-navy grid place-items-center font-black text-xs">
            {user.name.slice(0,1).toUpperCase()}
          </button>
        </div>
      </header>

      <nav className="sticky top-[56px] sm:top-[60px] z-30 bg-[#F8FAFC]/92 backdrop-blur border-b border-slate-200">
        <div className="max-w-3xl mx-auto px-3">
          <div className="flex gap-1 overflow-x-auto no-scrollbar py-2">
            {tabs.map(t => (
              <button key={t.k} onClick={() => setTab(t.k)}
                className={cx('shrink-0 inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl text-xs font-extrabold transition',
                  tab === t.k ? 'bg-navy text-white shadow-sm' : 'text-slate-500 hover:bg-slate-200/60')}>
                <Icon n={t.icon} s={14}/>{t.label}
                {t.k === 'messages' && unread > 0 && (
                  <span className={cx('ml-0.5 min-w-[17px] h-[17px] px-1 rounded-full text-[9px] font-black grid place-items-center',
                    tab === t.k ? 'bg-gold text-navy' : 'bg-gold text-navy')}>{unread}</span>
                )}
              </button>
            ))}
          </div>
        </div>
      </nav>

      <main className="max-w-3xl mx-auto px-3 sm:px-4 py-4">
        {isCoach ? (
          <div className="mb-3 flex items-center gap-2 text-[11px] font-bold text-gold-600 bg-gold/10 border border-gold/30 rounded-xl px-3 py-2">
            <Icon n="shield" s={14} className="shrink-0"/>
            <span className="flex-1 min-w-0">Editing <b>{team.name}</b> — changes save for everyone on the team.</span>
            {saveLabel && <span className={cx('shrink-0 font-bold', saveState === 'error' || saveState === 'conflict' ? 'text-red-600' : 'text-slate-500')}>{saveLabel}</span>}
          </div>
        ) : (
          <div className="mb-3 flex items-center gap-2 text-[11px] font-bold text-slateb bg-slateb/10 border border-slateb/25 rounded-xl px-3 py-2">
            <Icon n="eye" s={14} className="shrink-0"/>
            <span>Viewing {team.name}. Your coach keeps this up to date.</span>
          </div>
        )}

        {docErr && <Card className="p-4 mb-3"><ErrorNote>{docErr}</ErrorNote></Card>}

        {tab === 'messages' ? (
          <div key={'messages' + team.id} className="fade-in">
            <Messages team={team} me={user} onRead={refreshUnread} />
          </div>
        ) : !doc ? (
          <Card className="p-6"><p className="text-sm text-slate-500 text-center">Loading team…</p></Card>
        ) : (
          <div key={tab + team.id} className="fade-in">
            {tab === 'playbook'   && <Playbook db={doc} setDB={setDB} coach={isCoach} />}
            {tab === 'roster'     && <Roster db={doc} setDB={setDB} coach={isCoach} />}
            {tab === 'schedule'   && <Schedule db={doc} setDB={setDB} coach={isCoach} />}
            {tab === 'attendance' && isCoach && <Attendance db={doc} setDB={setDB} />}
            {tab === 'stats'      && <Stats db={doc} setDB={setDB} coach={isCoach} />}
          </div>
        )}
        <div className="flex items-center justify-center gap-1.5 mt-8 text-slate-400">
          <AppMark size="w-4 h-4" className="opacity-70" />
          <Wordmark className="text-[11px]" />
        </div>
      </main>

      <Modal open={teamPicker} onClose={() => setTeamPicker(false)} title="Your teams">
        <div className="space-y-1.5">
          {Object.entries(teams.reduce((groups, t) => {
            const k = t.programName || 'Other teams';
            (groups[k] = groups[k] || []).push(t);
            return groups;
          }, {})).map(([programName, list]) => (
            <div key={programName} className="pt-1">
              <p className="text-[10px] font-black uppercase tracking-wider text-slate-400 mb-1">{programName}</p>
              <div className="space-y-1.5">
          {list.map(t => (
            <button key={t.id} onClick={() => { setActiveId(t.id); setTab('playbook'); setTeamPicker(false); }}
              className={cx('w-full flex items-center gap-2 rounded-xl border px-3 py-2.5 text-left transition',
                t.id === team.id ? 'bg-navy text-white border-navy' : 'bg-white border-slate-200 hover:bg-slate-50')}>
              <span className="min-w-0 flex-1">
                <span className="block text-sm font-bold truncate">{t.name}</span>
                <span className={cx('block text-[11px]', t.id === team.id ? 'text-slate-300' : 'text-slate-500')}>
                  {(SPORTS[t.sport] || SPORTS.basketball).label} · {t.grade} · {t.role === 'coach' ? 'Coach' : 'Player'}
                </span>
              </span>
              {t.id === team.id && <Icon n="check" s={16} className="text-gold shrink-0"/>}
            </button>
          ))}
              </div>
            </div>
          ))}
        </div>
        {user.isAdmin && (
          <div className="pt-3 mt-3 border-t border-slate-100">
            <Btn variant="ghost" icon="sliders" className="w-full"
              onClick={() => { setTeamPicker(false); setAdmin(true); }}>Manage teams and people</Btn>
          </div>
        )}
      </Modal>

      <TeamSettings open={settings} onClose={() => setSettings(false)} team={team} me={user} />
      <AccountModal open={account} onClose={() => setAccount(false)} user={user} onSignOut={signOut} />
      <AdminPortal open={admin} onClose={() => setAdmin(false)} me={user} onChanged={refresh} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
